<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <script src="/assets/js/boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#06020a">
  <meta name="description" content="GAMEHUB – Spiele-Launcher mit 2D- und 3D-Spielen. Als App installierbar auf PC, Handy und Tablet.">
  <title>GAMEHUB</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GAMEHUB">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<div class="launcher">
  <aside class="sidebar" id="sidebar" aria-label="Navigation"></aside>
  <div class="scrim" data-close-nav></div>

  <main class="main">
    <!-- Kopfzeile nur auf Handy/Tablet -->
    <div class="mobile-top">
      <button class="icon-btn" type="button" data-open-nav aria-label="Menü öffnen"><svg class="icon icon-lg" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <a class="brand" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h4M8 10v4"/><path d="M15 13h.01M18 11h.01"/><rect x="2" y="6" width="20" height="12" rx="5"/></svg>GAMEHUB</a>
      <button class="icon-btn" type="button" data-random aria-label="Zufallsspiel"><svg class="icon icon-lg" viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg></button>
    </div>

    <!-- ============ Bibliothek ============ -->
    <section class="view" id="view-library" aria-label="Bibliothek">
      <div class="head">
        <h1 class="title" id="libTitle">Bibliothek</h1>
        <div class="actions">
          <label class="select">
            <span class="sr-only">Kategorie</span>
            <select id="categorySelect"><option value="">Alle Kategorien</option></select>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </label>
          <label class="select">
            <span class="sr-only">Sortierung</span>
            <select id="sortSelect">
              <option value="popular">Beliebt</option>
              <option value="recent">Zuletzt</option>
              <option value="az">A–Z</option>
            </select>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </label>
          <button class="btn" type="button" data-fullscreen id="fsBtn"></button>
          <button class="btn btn-white" type="button" data-random id="randomBtn"></button>
        </div>
      </div>

      <div class="hero" id="hero"></div>

      <div class="tabs-row">
        <div class="tabs" role="tablist" id="filterTabs">
          <button class="tab active" type="button" data-filter="all">Alle Spiele</button>
          <button class="tab" type="button" data-filter="favs">Favoriten</button>
          <button class="tab" type="button" data-filter="recent">Zuletzt gespielt</button>
          <button class="tab" type="button" data-filter="3d">3D-Spiele</button>
        </div>
        <span class="live" id="clock"></span>
      </div>

      <div class="stats" id="stats"></div>

      <div class="shelf-wrap">
        <div class="shelf-head">
          <h2 id="shelfTitle">Alle Spiele</h2>
          <span class="shelf-hint kbd-hint"><kbd>←</kbd><kbd>→</kbd> auswählen · <kbd>Enter</kbd> starten · <kbd>F</kbd> Favorit</span>
        </div>
        <div class="shelf" id="shelf" role="listbox" aria-label="Spiele"></div>
      </div>
    </section>

    <!-- ============ Konto ============ -->
    <section class="view" id="view-account" aria-label="Profil">
      <div class="head">
        <h1 class="title">Profil</h1>
        <div class="actions" id="accountActions"></div>
      </div>
      <div class="account-scroll">
        <div class="account-grid">
          <div>
            <div class="card" id="profileCard"></div>
            <div class="card">
              <div class="card-head"><h2 class="card-title">Deine Aktivität</h2><span class="card-meta">in diesem Browser</span></div>
              <div class="stats" id="activityStats"></div>
            </div>
            <div class="card">
              <div class="card-head">
                <h2 class="card-title">Bestwerte</h2>
                <div class="card-actions">
                  <button class="btn btn-sm" type="button" data-export>Exportieren</button>
                  <label class="btn btn-sm" title="Gesicherte Statistik laden">Importieren<input type="file" accept="application/json,.json" id="importFile" hidden></label>
                </div>
              </div>
              <div class="best-grid" id="bestList"></div>
            </div>
          </div>
          <div class="card">
            <div class="card-head"><h2 class="card-title">Meistgespielt</h2><span class="card-meta" id="topMeta"></span></div>
            <div id="topList"></div>
          </div>
        </div>
      </div>
    </section>

  </main>
</div>

<!-- ============ Player ============ -->
<div class="player" id="player" aria-hidden="true">
  <div class="player-bar">
    <button class="btn btn-sm" type="button" data-close-player id="closePlayerBtn"></button>
    <span class="name" id="playerName"></span>
    <span class="timer" id="playerTimer">00:00</span>
    <span class="spacer"></span>
    <button class="btn btn-sm variant-btn" type="button" id="variantBtn" hidden></button>
    <span class="muted kbd-hint" style="font-size:12.5px"><kbd>Shift</kbd>+<kbd>Esc</kbd> beenden</span>
    <button class="icon-btn" type="button" data-reload-player aria-label="Neu laden" id="reloadBtn"></button>
    <button class="icon-btn" type="button" data-fullscreen aria-label="Vollbild" id="playerFsBtn"></button>
    <span class="brand-mini">GAMEHUB</span>
  </div>
  <div class="player-stage">
    <iframe id="playerFrame" title="Spiel" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
    <div class="player-loading" id="playerLoading"><div class="spinner"></div></div>
  </div>
</div>

<div class="modal" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"></div>

<script src="/assets/js/games.js"></script>
<script src="/assets/js/core.js"></script>
<script src="/assets/js/launcher.js"></script>
</body>
</html>
