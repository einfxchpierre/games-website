<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e60000">

    <title>Phoenixmagie | Game Hub</title>
    <style>
        :root {
            --main-red: #e60000;
            --dark-bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --input-bg: #252525;
            --text-white: #ffffff;
            --text-gray: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--dark-bg);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-white);
            overflow: hidden; 
            position: fixed;
        }

        /* Smartphone-Scrollbar-Freigabe nach Video / Mobile scroll release after video */
        body.video-skipped, html.video-skipped {
            position: static !important;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            height: auto !important;
            min-height: 100% !important;
            -webkit-overflow-scrolling: touch !important;
        }

        #contentPage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease, visibility 1s ease;
            z-index: 10;
            -webkit-overflow-scrolling: touch;
        }

        /* Dokumentenfluss für mobiles Scrollen wiederherstellen / Restore document flow for mobile scrolling */
        body.video-skipped #contentPage {
            position: relative !important;
            height: auto !important;
            min-height: 100vh !important;
            overflow: visible !important;
        }

        #contentPage.active {
            opacity: 1;
            visibility: visible;
        }

        .instant-show {
            opacity: 1 !important;
            visibility: visible !important;
            transition: none !important;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 10px 20px 10px;
            position: relative;
        }

        h1 {
            font-size: clamp(2rem, 10vw, 4rem);
            margin: 0 0 20px 0;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        h1 span {
            color: var(--main-red);
        }

        .search-container {
            margin-bottom: 30px;
        }

        #searchBar {
            width: 100%;
            max-width: 600px;
            padding: 16px 25px;
            font-size: 1.1rem;
            border-radius: 50px;
            border: 2px solid var(--main-red);
            background: var(--input-bg);
            color: white;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        #searchBar:focus {
            box-shadow: 0 0 20px rgba(230, 0, 0, 0.5);
            transform: scale(1.02);
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            border-bottom: 5px solid var(--main-red);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 320px;
        }

        @media (hover: hover) {
            .game-card:hover {
                transform: translateY(-12px);
                background: #222;
            }
        }

        .game-card img {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px auto;
            border-radius: 20px;
            object-fit: cover;
            background: #333;
        }

        .game-card h3 {
            font-size: 1.2rem;
            margin: 10px 0;
            font-weight: 600;
        }

        .play-btn {
            display: block;
            width: 100%;
            padding: 14px 0;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: auto;
            transition: filter 0.2s ease;
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        #skipVideoButton {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background-color: var(--main-red);
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 50px;
            cursor: pointer;
            z-index: 99999;
            box-shadow: 0 4px 20px rgba(230, 0, 0, 0.4);
            transition: transform 0.2s ease;
        }

        #skipVideoButton:active {
            transform: scale(0.95);
        }

        #settingsTrigger {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(37, 37, 37, 0.8);
            border: 2px solid var(--main-red);
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 1.4rem;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            transition: transform 0.2s ease;
        }

        #settingsTrigger:active {
            transform: scale(0.9);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 100000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.open .modal-card {
            transform: translateY(0);
        }

        .modal-card h2 {
            margin-top: 0;
            font-size: 1.4rem;
            border-bottom: 2px solid var(--main-red);
            padding-bottom: 10px;
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0;
        }

        .setting-label {
            font-size: 1rem;
            font-weight: 500;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #444;
            transition: .3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--main-red);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .close-btn {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: none;
            color: white;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        @media (max-width: 992px) {
            .game-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 20px;
            }
            .game-card { min-height: 280px; }
            .game-card img { width: 80px; height: 80px; }
        }

        @media (max-width: 480px) {
            header { padding: 20px 5px; }
            .container { padding: 12px; }

            .game-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .game-card {
                padding: 15px 10px;
                min-height: 240px;
                border-radius: 18px;
            }

            .game-card img {
                width: 60px;
                height: 60px;
                border-radius: 15px;
            }

            .game-card h3 {
                font-size: 0.95rem;
                margin: 5px 0 10px 0;
            }

            .play-btn {
                padding: 10px 0;
                font-size: 0.8rem;
            }

            #skipVideoButton {
                bottom: 15px;
                right: 15px;
                padding: 10px 20px;
                font-size: 0.85rem;
            }

            #settingsTrigger {
                top: 15px;
                right: 15px;
                width: 40px;
                height: 40px;
                font-size: 1.1rem;
            }
        }
    </style>

    <script>
        const isVideoDisabled = localStorage.getItem('phoenixVideoDisabled') === 'true' || 
                               sessionStorage.getItem('phoenixVideoPlayed') === 'true';

        if (isVideoDisabled) {
            const antiVideoStyle = document.createElement('style');
            antiVideoStyle.id = 'antiVideoStyle';
            antiVideoStyle.textContent = `
                .video-overlay-layer, .video-player-container, #skipVideoButton { 
                    display: none !important; 
                    opacity: 0 !important; 
                    visibility: hidden !important; 
                    pointer-events: none !important; 
                }
            `;
            document.head.appendChild(antiVideoStyle);
        }
    </script>
</head>
<body>

<button id="settingsTrigger" onclick="toggleSettingsModal()" aria-label="Einstellungen">⚙️</button>

<button id="skipVideoButton" onclick="skipVideo()">Video überspringen</button>

<div id="contentPage">
    <div class="container">
        <header>
            <h1><span>GAME</span>HUB</h1>
            <div class="search-container">
                <input type="text" id="searchBar" placeholder="Spiel suchen..." onkeyup="filterGames()">
            </div>
        </header>

        <main class="game-grid" id="gameGrid">
        </main>
    </div>
</div>

<div class="modal-overlay" id="settingsModal" onclick="closeModalOnOverlay(event)">
    <div class="modal-card">
        <h2>Einstellungen</h2>
        <div class="setting-row">
            <span class="setting-label">Intro-Video aktivieren</span>
            <label class="switch">
                <input type="checkbox" id="videoToggle" onchange="toggleVideoSetting(this.checked)">
                <span class="slider"></span>
            </label>
        </div>
        <button class="close-btn" onclick="toggleSettingsModal()">Schließen</button>
    </div>
</div>

<script src="games.js"></script>

<script>
    function skipVideo() {
        sessionStorage.setItem('phoenixVideoPlayed', 'true');
        
        /* Ruft die Entsperrung aus phoenix.js auf / Calls unlock function from phoenix.js */
        if (typeof window.finishVideoExperience === 'function') {
            window.finishVideoExperience();
        } else {
            document.documentElement.classList.add('video-skipped');
            document.body.classList.add('video-skipped');
            const contentPage = document.getElementById('contentPage');
            if (contentPage) contentPage.classList.add('instant-show');
        }

        const skipBtn = document.getElementById('skipVideoButton');
        if (skipBtn) skipBtn.style.display = 'none';
    }

    function toggleSettingsModal() {
        const modal = document.getElementById('settingsModal');
        const toggle = document.getElementById('videoToggle');
        
        const isVideoDisabled = localStorage.getItem('phoenixVideoDisabled') === 'true';
        toggle.checked = !isVideoDisabled;

        modal.classList.toggle('open');
    }

    function closeModalOnOverlay(e) {
        if (e.target.id === 'settingsModal') {
            toggleSettingsModal();
        }
    }

    function toggleVideoSetting(enabled) {
        if (enabled) {
            localStorage.removeItem('phoenixVideoDisabled');
            sessionStorage.removeItem('phoenixVideoPlayed');
        } else {
            localStorage.setItem('phoenixVideoDisabled', 'true');
        }
    }

    function renderHub(filterText = "") {
        const grid = document.getElementById('gameGrid');
        grid.innerHTML = "";

        const GAMES_DATA_SAFE = typeof GAMES_DATA !== 'undefined' ? GAMES_DATA : [];

        const filtered = GAMES_DATA_SAFE.filter(game => 
            game.game_name.toLowerCase().includes(filterText.toLowerCase())
        );

        filtered.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `
                <img src="${game.icon}" alt="${game.game_name}" onerror="this.src='https://via.placeholder.com/100/333/e60000?text=?'">
                <h3>${game.game_name}</h3>
                <a href="${game.path}" class="play-btn" style="background-color: ${game.btn_color}">Spielen</a>
            `;
            grid.appendChild(card);
        });

        if (filtered.length === 0) {
            grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #666;">Kein Spiel unter "${filterText}" gefunden.</p>`;
        }
    }

    function filterGames() {
        const input = document.getElementById('searchBar');
        renderHub(input.value);
    }

    window.onload = () => renderHub();

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('SW registriert!'))
                .catch(err => console.log('SW Fehler', err));
        });
    }
</script>

<script src="https://phoenixmagie.vercel.app/beta/phoenix.js"></script>

</body>
</html>
