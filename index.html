<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08060b">
  <meta name="description" content="Phoenix Arcade – deine Browser-Spielesammlung: Tetris, Snake, Schach, Tower Defense und mehr.">
  <title>Phoenix Arcade</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body data-page="hub">

<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navigation"></aside>
  <div class="scrim"></div>

  <div>
    <header class="topbar" id="topbar"></header>

    <main class="main">
      <div class="container">

        <div class="page-head">
          <h1 class="page-title">Spiele</h1>
          <div class="actions">
            <label class="select">
              <span class="sr-only">Kategorie</span>
              <select id="categorySelect"><option value="">Alle Kategorien</option></select>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </label>
            <label class="select">
              <span class="sr-only">Sortierung</span>
              <select id="sortSelect">
                <option value="popular">Beliebt</option>
                <option value="recent">Zuletzt</option>
                <option value="az">A–Z</option>
              </select>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </label>
            <a class="btn" href="/konto.html" id="accountBtn">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
              Konto
            </a>
            <button class="btn btn-primary" type="button" data-random>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
              Zufallsspiel
            </button>
          </div>
        </div>

        <section class="hero" aria-label="Aktivität">
          <div>
            <p class="metric-value" id="metricValue">0<small>Sessions</small></p>
            <div class="metric-sub" id="metricSub"></div>
          </div>
          <div class="seg" role="tablist" aria-label="Zeitraum" id="rangeSeg">
            <button type="button" data-range="7">1W</button>
            <button type="button" data-range="30" class="active">1M</button>
            <button type="button" data-range="90">3M</button>
            <button type="button" data-range="365">1J</button>
            <button type="button" data-range="max">Max</button>
          </div>
        </section>

        <div class="chart" id="chart"><div class="chart-tip" id="chartTip"></div></div>

        <div class="tabs-row">
          <div class="tabs" role="tablist" id="viewTabs">
            <button class="tab active" type="button" data-view="all">Alle Spiele</button>
            <button class="tab" type="button" data-view="favs">Favoriten</button>
            <button class="tab" type="button" data-view="recent">Zuletzt gespielt</button>
          </div>
          <span class="live" id="liveClock">Lokal</span>
        </div>

        <section class="stats" id="stats" aria-label="Kennzahlen"></section>

        <button class="cta-dashed" type="button" data-random>
          <span class="left">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            Zufälliges Spiel starten
          </span>
          <span class="hint">z. B. Tetris, Snake oder Schach</span>
        </button>

        <div class="grid-2">
          <section class="card" aria-labelledby="libTitle">
            <div class="card-head">
              <h2 class="card-title" id="libTitle">Bibliothek</h2>
              <span class="card-meta" id="libCount"></span>
            </div>
            <div class="table-head">
              <span>Spiel</span>
              <span class="col-cat">Kategorie</span>
              <span class="r col-plays">Sessions</span>
              <span class="r col-last">Zuletzt</span>
              <span class="r"></span>
            </div>
            <div id="library"></div>
          </section>

          <section class="card" aria-labelledby="distTitle">
            <div class="card-head">
              <h2 class="card-title" id="distTitle">Verteilung</h2>
              <span class="card-meta" id="distMeta"></span>
            </div>
            <div class="card-body">
              <div class="donut-wrap" id="donut"></div>
              <div class="legend" id="legend"></div>
            </div>
          </section>
        </div>

        <div class="section-title">
          <h2>Entdecken</h2>
          <span class="card-meta" id="tilesMeta"></span>
        </div>
        <section class="tiles" id="tiles" aria-label="Alle Spiele"></section>

      </div>
    </main>
  </div>
</div>

<script src="/assets/js/games.js"></script>
<script src="/assets/js/core.js"></script>
<script src="/assets/js/hub.js"></script>
</body>
</html>
