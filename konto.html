<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Konto | Phoenixmagie Game Hub</title>
    <style>
        :root {
            --main-red: #e60000;
            --dark-bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --input-bg: #252525;
            --text-white: #ffffff;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--dark-bg);
            color: var(--text-white);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            border-bottom: 5px solid var(--main-red);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--main-red);
            background: #333;
        }

        .user-info h2 {
            margin: 0 0 5px 0;
            color: var(--main-red);
        }

        .user-info p {
            margin: 0;
            color: #aaa;
            font-size: 0.9rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--input-bg);
            padding: 15px;
            border-radius: 12px;
        }

        .stat-card .label {
            display: block;
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 5px;
        }

        .stat-card .value {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            text-align: center;
            background: var(--input-bg);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            box-sizing: border-box;
            margin-top: 10px;
        }

        .btn-danger {
            background: var(--main-red);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img id="userAvatar" class="avatar" src="https://via.placeholder.com/80/333/e60000?text=?" alt="Avatar">
        <div class="user-info">
            <h2 id="visualName">Lade...</h2>
            <p id="username">@...</p>
        </div>
    </div>

    <p id="beschreibung" style="color: #ccc; font-style: italic; margin-bottom: 20px;"></p>

    <div class="stats-grid">
        <div class="stat-card">
            <span class="label">Level</span>
            <span class="value" id="valLevel">-</span>
        </div>
        <div class="stat-card">
            <span class="label">XP</span>
            <span class="value" id="valXP">-</span>
        </div>
        <div class="stat-card">
            <span class="label">Aurum</span>
            <span class="value" id="valAurum">-</span>
        </div>
        <div class="stat-card">
            <span class="label">Mana</span>
            <span class="value" id="valMana">-</span>
        </div>
    </div>

    <a href="/index.html" class="btn">Zurück zum Game Hub</a>
    <button class="btn btn-danger" onclick="logout()">Abmelden</button>
</div>

<script>
    async function loadUserData() {
        const token = localStorage.getItem('access_token');
        const configRaw = localStorage.getItem('oauth_config');

        if (!token) {
            window.location.href = '/index.html';
            return;
        }

        let userinfoEndpoint = 'https://phoenixmagie.vercel.app/api/example.js';
        if (configRaw) {
            const config = JSON.parse(configRaw);
            if (config.userinfo_endpoint) {
                userinfoEndpoint = config.userinfo_endpoint.startsWith('http') 
                    ? config.userinfo_endpoint 
                    : 'https://phoenixmagie.vercel.app' + config.userinfo_endpoint;
            }
        }

        try {
            // Abfrage der User-Daten mit Token / Request user data using token
            const response = await fetch(userinfoEndpoint, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) throw new Error('Token ungültig');

            const data = await response.json();

            // UI mit erhaltenen Scope-Daten befüllen / Populate UI with retrieved scope data
            document.getElementById('visualName').innerText = data.visual_name || data.username || 'Unbekannt';
            document.getElementById('username').innerText = '@' + (data.username || 'user');
            document.getElementById('beschreibung').innerText = data.beschreibung || 'Keine Beschreibung angegeben.';
            document.getElementById('valLevel').innerText = data.level ?? '0';
            document.getElementById('valXP').innerText = data.xp ?? '0';
            document.getElementById('valAurum').innerText = data.aurum ?? '0';
            document.getElementById('valMana').innerText = data.mana ?? '0';
            
            if (data.avatar) {
                document.getElementById('userAvatar').src = data.avatar;
            }
        } catch (err) {
            // Fehlerbehandlung bei ungültigem Session Token / Handle invalid session token error
            alert('Sitzung abgelaufen. Bitte erneut anmelden.');
            logout();
        }
    }

    function logout() {
        localStorage.removeItem('access_token');
        localStorage.removeItem('refresh_token');
        window.location.href = '/index.html';
    }

    window.addEventListener('DOMContentLoaded', loadUserData);
</script>

</body>
</html>
