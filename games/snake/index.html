<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <script src="/assets/js/device-guard.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake · GAMEHUB</title>
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/games/snake/style.css">
</head>
<body>

    <div class="game-wrapper">
        <div class="header">
            <span class="score-board">Score: <span id="currentScore">0</span></span>
        </div>

        <canvas id="snakeCanvas" width="400" height="400"></canvas>

        <div class="mobile-controls">
            <button class="ctrl-btn" id="btnUp">▲</button>
            <div class="mid-row">
                <button class="ctrl-btn" id="btnLeft">◀</button>
                <button class="ctrl-btn" id="btnDown">▼</button>
                <button class="ctrl-btn" id="btnRight">▶</button>
            </div>
        </div>
        
        <a href="/" class="exit-link">Zurück zum Hub</a>
    </div>

    <script src="/games/snake/game.js"></script>
</body>
</html>
