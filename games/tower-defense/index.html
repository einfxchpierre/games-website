<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tower Defense</title>
    <link rel="stylesheet" href="/games/tower-defense/style.css">
    <style>
        /* Styles für das Version-Auswahl-Pop-up */
        #version-popup {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 5, 15, 0.95);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .popup-content {
            background: rgba(20, 20, 40, 0.8);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
        }
        .popup-content h2 {
            margin-top: 0;
            color: #00ffcc;
            font-size: 24px;
        }
        .popup-content p {
            color: #e4e4e4;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .popup-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .popup-btn {
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            color: white;
        }
        .btn-classic {
            background: linear-gradient(135deg, #2c3e50, #34495e);
        }
        .btn-classic:hover {
            background: linear-gradient(135deg, #34495e, #4e6a85);
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }
        .btn-new {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            border-color: #00ffcc;
        }
        .btn-new:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }
    </style>
</head>
<body>

    <!-- VERSION SELECTION POP-UP -->
    <div id="version-popup">
        <div class="popup-content">
            <h2>Version wählen</h2>
            <p>Welche Version von Tower Defense Pro möchtest du spielen?</p>
            <div class="popup-options">
                <!-- Startet das normale Spiel auf dieser Seite -->
                <button class="popup-btn btn-classic" onclick="startClassicVersion()">Klassische Version (2D)</button>
                <!-- Leitet auf die neue 3D-Handy-Version weiter (Passe den Dateinamen ggf. an!) -->
                <a href="#" class="popup-btn btn-new">Neue Version (3D) || NICHT VERFÜGBAR</a>
            </div>
        </div>
    </div>

    <div id="game-ui">
        <div class="stats">
            💰 <span id="money">200</span> | ❤️ <span id="lives">20</span> | Welle: <span id="wave">1</span>
        </div>
        <div class="shop">
            <button class="tower-btn" id="btn-basic" onclick="selectTower('basic')">Turm (50€)</button>
            <button class="tower-btn" id="btn-sniper" onclick="selectTower('sniper')">Sniper (100€)</button>
            <a href="/index.html" class="exit-btn">Hub</a>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="game-over-screen" class="hidden">
        <h1>GAME OVER</h1>
        <p>Die Basis wurde überrannt!</p>
        <div class="final-stats">
            Wellen überlebt: <span id="final-wave">0</span><br>
            Bester Rekord: <span id="high-score">0</span>
        </div>
        <button class="retry-btn" onclick="restartGame()">REVANCHE</button>
        <br>
        <a href="/index.html" class="exit-link">Zum Hub</a>
    </div>

    <script src="/games/tower-defense/game.js"></script>
    <script>
        // Schließt einfach das Pop-up, sodass das geladene game.js normal läuft
        function startClassicVersion() {
            document.getElementById('version-popup').style.display = 'none';
        }
    </script>
</body>
</html>
