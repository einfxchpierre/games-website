<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <script src="/assets/js/device-guard.js"></script>
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>3D Tower Defense Mobile</title>
        <style>
          body {
          margin: 0; padding: 0; overflow: hidden;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          user-select: none; -webkit-user-select: none;
          background-color: #050510;
          touch-action: none; /* Verhindert Standard-Browser-Zoom/Scrollen */
          }
          #canvas-container { width: 100vw; height: 100vh; position: absolute; top:0; left:0; z-index: 1; }
          
          /* Mobile UI Top Overlay */
          #ui {
          position: absolute; top: 12px; left: 12px; right: 12px;
          color: white; font-size: 14px; pointer-events: none;
          display: flex; justify-content: space-between; gap: 6px;
          z-index: 10;
          }
          .stat {
          background: rgba(10, 10, 25, 0.85); padding: 6px 10px;
          border-radius: 8px; border-left: 3px solid #00ffcc;
          box-shadow: 0 4px 6px rgba(0,0,0,0.3);
          backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
          flex: 1; text-align: center; white-space: nowrap;
          }
          #gold-stat { border-left-color: #ffd700; }
          #hp-stat { border-left-color: #ff3333; }
          
          /* Mobile Toolbar (Unten) */
          #toolbar {
          position: absolute; bottom: 16px; left: 8px; right: 8px;
          background: rgba(10, 10, 25, 0.9);
          padding: 10px; border-radius: 12px;
          display: flex; gap: 8px; justify-content: space-between;
          box-shadow: 0 8px 20px rgba(0,0,0,0.5);
          border: 1px solid rgba(255,255,255,0.1);
          z-index: 10;
          backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
          }
          .btn {
          background: linear-gradient(135deg, #1f4068, #162447);
          color: #e4e4e4; border: 1px solid rgba(255,255,255,0.1);
          padding: 12px 6px; font-size: 11px; font-weight: bold;
          border-radius: 8px; cursor: pointer; transition: background 0.2s;
          flex: 1; text-align: center; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 2px;
          -webkit-tap-highlight-color: transparent;
          }
          .btn.active {
          background: linear-gradient(135deg, #00b4db, #0083b0);
          border-color: #00ffcc; box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
          color: white;
          }
          .btn span { font-size: 9px; opacity: 0.8; font-weight: normal; }
          
          #game-over {
          position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
          color: #ff3333; font-size: 32px; font-weight: bold; background: rgba(5,5,15,0.95);
          padding: 30px; border-radius: 15px; text-align: center; display: none;
          border: 2px solid #ff3333; box-shadow: 0 0 20px rgba(255,51,51,0.5);
          z-index: 100; width: 70%; max-width: 300px;
          }
        </style>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
        </script>
        <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js">
        </script>
      </head>
      <body>
        <div id="ui">
          <div class="stat" id="hp-stat">❤️ <span id="hp-val">20</span>
        </div>
        <div class="stat" id="gold-stat">💰 <span id="gold-val">250</span>
      </div>
      <div class="stat">🛸 W. <span id="wave-val">1</span>
    </div>
  </div>
  <div id="toolbar">
    <button class="btn active" id="type-laser" onclick="selectTower('laser')">
      Laser
      <span>💰 100</span>
    </button>
    <button class="btn" id="type-plasma" onclick="selectTower('plasma')">
      Plasma
      <span>💰 200</span>
    </button>
    <button class="btn" id="type-gatling" onclick="selectTower('gatling')">
      Gatling
      <span>💰 150</span>
    </button>
  </div>
  <div id="game-over">
    GAME OVER
    <br>
      <button class="btn" style="margin: 15px auto 0 auto; padding: 10px 20px;" onclick="location.reload()">Neu starten</button>
    </div>
    <div id="canvas-container">
    </div>
    <script>
      const GAME = {
      hp: 20, gold: 250, wave: 1, gameOver: false,
      mapSize: 34, currentType: 'laser'
      };
      
      const TOWER_TYPES = {
      laser: { cost: 100, range: 6.5, fireRate: 0.5, color: 0x00ffcc, bulletColor: 0x00ffff, speed: 22, damage: 20, aoe: 0, size: 0.45 },
      plasma: { cost: 200, range: 10, fireRate: 1.5, color: 0xffaa00, bulletColor: 0xff4500, speed: 10, damage: 65, aoe: 3.2, size: 0.75 },
      gatling: { cost: 150, range: 5, fireRate: 0.12, color: 0x9900ff, bulletColor: 0xff00ff, speed: 30, damage: 5, aoe: 0, size: 0.38 }
      };
      
      const pathPoints = [
      new THREE.Vector3(-17, 0.1, -10),
      new THREE.Vector3(-4, 0.1, -10),
      new THREE.Vector3(-4, 0.1, 4),
      new THREE.Vector3(6, 0.1, 4),
      new THREE.Vector3(6, 0.1, -6),
      new THREE.Vector3(15, 0.1, -6),
      new THREE.Vector3(15, 0.1, 15)
      ];
      
      let scene, camera, renderer, controls, groundMesh;
      let enemies = [], towers = [], projectiles = [], particles = [];
      
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      const clock = new THREE.Clock();
      
      // Variablen um ungewolltes Platzieren beim Kamera-Drehen (Sliden) zu verhindern
      let touchStartX = 0, touchStartY = 0;
      const touchDeadzone = 8;
      
      function init() {
      const container = document.getElementById('canvas-container');
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050510);
      scene.fog = new THREE.FogExp2(0x050510, 0.02);
      
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 26, 28);
      
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Performance-Cap für High-Res Displays
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap; // Schnellere Schatten für Mobile
      container.appendChild(renderer.domElement);
      
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, 2);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.maxPolarAngle = Math.PI / 2.2;
      controls.minDistance = 10;
      controls.maxDistance = 50;
      
      scene.add(new THREE.AmbientLight(0xffffff, 0.45));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
      dirLight.position.set(15, 30, 15);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1048; // Kleinere Textur = flüssiger auf Handys
      dirLight.shadow.mapSize.height = 1048;
      dirLight.shadow.camera.near = 0.5;
      dirLight.shadow.camera.far = 80;
      const d = 22;
      dirLight.shadow.camera.left = -d; dirLight.shadow.camera.right = d;
      dirLight.shadow.camera.top = d; dirLight.shadow.camera.bottom = -d;
      scene.add(dirLight);
      
      createMap();
      updateUI();
      
      window.addEventListener('resize', onWindowResize);
      
      // Mobile-freundliche Input Listener
      window.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      }, { passive: true });
      
      window.addEventListener('touchend', onMobileClick);
      window.addEventListener('click', onMapClick); // Fallback für Desktop-Testing
      
      spawnWave();
      animate();
      }
      
      function createMap() {
      const groundGeo = new THREE.PlaneGeometry(GAME.mapSize, GAME.mapSize);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x121225, roughness: 0.8 });
      groundMesh = new THREE.Mesh(groundGeo, groundMat);
      groundMesh.rotation.x = -Math.PI / 2;
      groundMesh.receiveShadow = true;
      scene.add(groundMesh);
      
      const grid = new THREE.GridHelper(GAME.mapSize, GAME.mapSize, 0x00ffcc, 0x181830);
      grid.position.y = 0.01;
      scene.add(grid);
      
      for (let i = 0; i < pathPoints.length - 1; i++) {
      const p1 = pathPoints[i];
      const p2 = pathPoints[i+1];
      const distance = p1.distanceTo(p2);
      const roadGeo = new THREE.PlaneGeometry(2.2, distance + 2.2);
      const roadMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x001a10, roughness: 0.6 });
      const road = new THREE.Mesh(roadGeo, roadMat);
      
      const midPoint = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
      road.position.copy(midPoint);
      road.position.y = 0.02;
      road.rotation.x = -Math.PI / 2;
      road.rotation.z = Math.atan2(p2.x - p1.x, p2.z - p1.z);
      scene.add(road);
      }
      
      const markerGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.2, 12);
      const startM = new THREE.Mesh(markerGeo, new THREE.MeshStandardMaterial({color: 0x00ff00}));
      startM.position.copy(pathPoints[0]);
      scene.add(startM);
      
      const endM = new THREE.Mesh(markerGeo, new THREE.MeshStandardMaterial({color: 0xff0055}));
      endM.position.copy(pathPoints[pathPoints.length-1]);
      scene.add(endM);
      }
      
      function selectTower(type) {
      GAME.currentType = type;
      document.querySelectorAll('#toolbar .btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`type-${type}`).classList.add('active');
      }
      
      function distanceToPath(point) {
      let minDistance = Infinity;
      for (let i = 0; i < pathPoints.length - 1; i++) {
      const p1 = pathPoints[i]; const p2 = pathPoints[i+1];
      const l2 = p1.distanceToSquared(p2); if (l2 === 0) continue;
      let t = ((point.x - p1.x) * (p2.x - p1.x) + (point.z - p1.z) * (p2.z - p1.z)) / l2;
      t = Math.max(0, Math.min(1, t));
      const projection = new THREE.Vector3(p1.x + t * (p2.x - p1.x), 0.1, p1.z + t * (p2.z - p1.z));
      const dist = point.distanceTo(projection);
      if (dist < minDistance) minDistance = dist;
      }
      return minDistance;
      }
      
      function handlePlacement(clientX, clientY) {
      if (GAME.gameOver) return;
      
      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;
      
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(groundMesh);
      
      if (intersects.length > 0) {
      const clickPoint = intersects[0].point;
      const typeData = TOWER_TYPES[GAME.currentType];
      
      if (GAME.gold < typeData.cost) { flashUI('gold-stat'); return; }
      if (distanceToPath(clickPoint) < 1.8) return;
      
      let tooClose = false;
      towers.forEach(t => { if (clickPoint.distanceTo(t.mesh.position) < 1.5) tooClose = true; });
      if (tooClose) return;
      
      GAME.gold -= typeData.cost;
      updateUI();
      buildTower(clickPoint.x, clickPoint.z, GAME.currentType);
      }
      }
      
      function onMobileClick(event) {
      if (event.target.closest('#toolbar') || event.target.closest('#ui') || event.target.closest('#game-over')) return;
      
      // Berechne Swipe-Distanz. Wenn der Finger gewischt hat (Kameradrehung), baue keinen Turm.
      const deltaX = Math.abs(event.changedTouches[0].clientX - touchStartX);
      const deltaY = Math.abs(event.changedTouches[0].clientY - touchStartY);
      
      if (deltaX < touchDeadzone && deltaY < touchDeadzone) {
      handlePlacement(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
      }
      }
      
      function onMapClick(event) {
      // Nur ausführen, wenn es kein Touch-Event war (wichtig für Hybrid-Geräte)
      if (event.pointerType === 'touch') return;
      if (event.target.closest('#toolbar') || event.target.closest('#ui') || event.target.closest('#game-over')) return;
      handlePlacement(event.clientX, event.clientY);
      }
      
      function buildTower(x, z, type) {
      const config = TOWER_TYPES[type];
      const group = new THREE.Group();
      
      const baseGeo = new THREE.CylinderGeometry(config.size * 0.7, config.size, 1.2, 5);
      const baseMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.3 });
      const base = new THREE.Mesh(baseGeo, baseMat);
      base.position.y = 0.6;
      base.castShadow = true;
      group.add(base);
      
      const headGeo = new THREE.SphereGeometry(config.size, 12, 12);
      const headMat = new THREE.MeshStandardMaterial({ color: config.color, metalness: 0.6 });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 1.2;
      head.castShadow = true;
      group.add(head);
      
      const gunGeo = new THREE.CylinderGeometry(config.size * 0.2, config.size * 0.2, config.size * 1.3, 6);
      gunGeo.rotateX(Math.PI / 2);
      const gun = new THREE.Mesh(gunGeo, baseMat);
      gun.position.set(0, 1.2, config.size * 0.6);
      gun.castShadow = true;
      group.add(gun);
      
      group.position.set(x, 0, z);
      scene.add(group);
      
      towers.push({ mesh: group, type: type, config: config, lastShot: 0 });
      
      group.scale.set(0,0,0);
      let s = 0;
      function grow() {
      s += 0.15;
      if(s <= 1) { group.scale.set(s,s,s); requestAnimationFrame(grow); }
      else { group.scale.set(1,1,1); }
      }
      grow();
      }
      
      function spawnWave() {
      if (GAME.gameOver) return;
      let count = 4 + GAME.wave * 2;
      let spawned = 0;
      
      const interval = setInterval(() => {
      if (GAME.gameOver) { clearInterval(interval); return; }
      createEnemy();
      spawned++;
      if (spawned >= count) {
      clearInterval(interval);
      setTimeout(() => { if (!GAME.gameOver) { GAME.wave++; updateUI(); spawnWave(); } }, 8000);
      }
      }, Math.max(500, 1600 - GAME.wave * 90));
      }
      
      function createEnemy() {
      const group = new THREE.Group();
      const isBoss = (enemies.length % 7 === 0 && GAME.wave > 2);
      const size = isBoss ? 0.75 : 0.4;
      
      const coreGeo = new THREE.OctahedronGeometry(size, 0);
      const coreMat = new THREE.MeshStandardMaterial({ color: isBoss ? 0xff0033 : 0xff00aa, roughness: 0.2 });
      const core = new THREE.Mesh(coreGeo, coreMat);
      core.position.y = size + 0.1;
      core.castShadow = true;
      group.add(core);
      
      group.position.copy(pathPoints[0]);
      scene.add(group);
      
      enemies.push({
      mesh: group, core: core, pathIndex: 0,
      hp: (isBoss ? 180 : 30) + GAME.wave * 16,
      speed: (isBoss ? 1.4 : 2.4) + (GAME.wave * 0.1),
      reward: isBoss ? 50 : 12
      });
      }
      
      function spawnProjectile(startPos, target, config) {
      const geo = new THREE.SphereGeometry(config.type === 'plasma' ? 0.28 : 0.12, 6, 6);
      const mat = new THREE.MeshBasicMaterial({ color: config.bulletColor });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(startPos);
      scene.add(mesh);
      
      projectiles.push({ mesh: mesh, target: target, config: config, lastKnownTargetPos: target.mesh.position.clone() });
      }
      
      function createExplosion(pos, color = 0xff00ff, count = 6, size = 0.12) {
      for(let i=0; i<count; i++) {
      const p = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), new THREE.MeshBasicMaterial({ color: color }));
      p.position.copy(pos);
      scene.add(p);
      particles.push({
      mesh: p,
      vel: new THREE.Vector3((Math.random()-0.5)*5, (Math.random())*4 + 1, (Math.random()-0.5)*5),
      life: 1.0
      });
      }
      }
      
      function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1); // Cap delta um Ruckler abzufangen
      const time = clock.getElapsedTime();
      
      if (!GAME.gameOver) {
      // 1. Gegner bewegen
      for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.core.rotation.x += delta * 1.5;
      
      const targetIdx = e.pathIndex + 1;
      if (targetIdx < pathPoints.length) {
      const targetPos = pathPoints[targetIdx].clone();
      targetPos.y = e.mesh.position.y;
      const dir = new THREE.Vector3().subVectors(targetPos, e.mesh.position);
      const dist = dir.length();
      const moveDist = e.speed * delta;
      
      if (moveDist >= dist) { e.mesh.position.copy(targetPos); e.pathIndex++; }
      else { dir.normalize(); e.mesh.translateOnAxis(dir, moveDist); }
      } else {
      GAME.hp--; updateUI(); flashUI('hp-stat');
      scene.remove(e.mesh); enemies.splice(i, 1);
      if (GAME.hp <= 0) { GAME.gameOver = true; document.getElementById('game-over').style.display = 'block'; }
      }
      }
      
      // 2. Türme KI
      towers.forEach(t => {
      let target = null; let minDist = t.config.range;
      enemies.forEach(e => {
      const dist = t.mesh.position.distanceTo(e.mesh.position);
      if (dist < minDist) { minDist = dist; target = e; }
      });
      
      if (target) {
      const lookTarget = target.mesh.position.clone(); lookTarget.y = t.mesh.position.y + 1.2;
      t.mesh.lookAt(lookTarget);
      
      if (time - t.lastShot > t.config.fireRate) {
      spawnProjectile(t.mesh.position.clone().add(new THREE.Vector3(0, 1.2, 0)), target, t.config);
      t.lastShot = time;
      }
      }
      });
      
      // 3. Projektile bewegen
      for (let i = projectiles.length - 1; i >= 0; i--) {
      const p = projectiles[i];
      if (enemies.includes(p.target)) p.lastKnownTargetPos.copy(p.target.mesh.position).add(new THREE.Vector3(0, 0.3, 0));
      
      const dir = new THREE.Vector3().subVectors(p.lastKnownTargetPos, p.mesh.position);
      const dist = dir.length();
      const step = p.config.speed * delta;
      
      if (step >= dist || dist < 0.2) {
      if (p.config.aoe > 0) {
      createExplosion(p.lastKnownTargetPos, p.config.bulletColor, 12, 0.22);
      for (let j = enemies.length - 1; j >= 0; j--) {
      if (enemies[j].mesh.position.distanceTo(p.lastKnownTargetPos) <= p.config.aoe) {
      enemies[j].hp -= p.config.damage;
      if (enemies[j].hp <= 0) { GAME.gold += enemies[j].reward; scene.remove(enemies[j].mesh); enemies.splice(j, 1); }
      }
      }
      } else {
      createExplosion(p.lastKnownTargetPos, p.config.bulletColor, 4, 0.12);
      if (enemies.includes(p.target)) {
      p.target.hp -= p.config.damage;
      if (p.target.hp <= 0) { GAME.gold += p.target.reward; scene.remove(p.target.mesh); enemies.splice(enemies.indexOf(p.target), 1); }
      }
      }
      updateUI(); scene.remove(p.mesh); projectiles.splice(i, 1);
      } else { dir.normalize(); p.mesh.translateOnAxis(dir, step); }
      }
      }
      
            // 4. Partikel updaten
      for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.life -= delta * 2.2;
      p.mesh.position.addScaledVector(p.vel, delta); p.mesh.scale.setScalar(p.life);
      if (p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
      }
      
      controls.update();
      renderer.render(scene, camera);
      }
      
      function updateUI() {
      document.getElementById('hp-val').innerText = GAME.hp;
      document.getElementById('gold-val').innerText = GAME.gold;
      document.getElementById('wave-val').innerText = GAME.wave;
      }
      
      function flashUI(id) {
      const el = document.getElementById(id); el.style.backgroundColor = 'rgba(255, 0, 0, 0.6)';
      setTimeout(() => el.style.backgroundColor = 'rgba(10, 10, 25, 0.85)', 250);
      }
      
      function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      }
      
      window.onload = init;
    </script>
  </body>
</html>
