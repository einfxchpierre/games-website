<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Pro Chess - Mobile Clean Edition</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>

    <div id="menu-overlay">
        <div class="menu-card">
            <h1>3D Pro Chess</h1>
            <p class="elo-display">Dein ELO: <span id="player-elo">1200</span></p>
            
            <div class="menu-section">
                <h3>Gegen die KI spielen</h3>
                <div class="control-group">
                    <label for="color-select">Deine Farbe:</label>
                    <select id="color-select">
                        <option value="w" selected>Weiß</option>
                        <option value="b">Schwarz</option>
                        <option value="random">Zufall</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="difficulty-select">KI-Stufe:</label>
                    <select id="difficulty-select">
                        <option value="0">Stufe 1: Anfänger (~800)</option>
                        <option value="1">Stufe 2: Hobby (~1200)</option>
                        <option value="2" selected>Stufe 3: Fortgeschritten (~1600)</option>
                        <option value="3">Stufe 4: Meister (~2000)</option>
                        <option value="4">Stufe 5: Großmeister (~2400)</option>
                    </select>
                </div>
                <button id="btn-start-game" class="btn-primary">Spiel starten</button>
            </div>

            <div class="menu-section">
                <h3>Online Multiplayer</h3>
                <p id="mp-status" style="font-size:0.8rem; margin-bottom:8px;">Status: Offline</p>
                <button id="btn-create-room">Raum erstellen</button>
                <div id="room-code-display" style="display:none; margin-top:8px;">
                    <p style="font-size:0.75rem; margin:0;">Code für Freunde:</p>
                    <input type="text" id="share-code-input" readonly>
                </div>
                <div class="join-group">
                    <input type="text" id="join-code-input" placeholder="Raum-Code...">
                    <button id="btn-join-room">Beitreten</button>
                </div>
            </div>
        </div>
    </div>

    <div id="game-status-bar" style="display: none;">
        <span id="status-msg">Bereit</span>
        <span id="opponent-info" style="font-weight: normal; opacity: 0.8;"></span>
        <button id="btn-menu-back">Menü</button>
    </div>

    <div id="timeline-panel" style="display: none;">
        <button id="btn-undo">◀ Zg.</button>
        <span id="timeline-label">Start</span>
        <button id="btn-redo">Zg. ▶</button>
        <button id="btn-jump-current" style="background:#4CAF50;">Aktuell</button>
    </div>

    <div id="loading" class="loading">Schachwelt wird geladen...</div>
    <div id="canvas-container"></div>

    <script src="ai.js"></script>
    <script src="game.js"></script>
</body>
</html>
