<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
    <script src="/assets/js/boot.js">
  // Initiales Bild hinter dem Startdialog
  map = JSON.parse(JSON.stringify(initialMap));
  fitCanvas();
</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pac Man · GAMEHUB</title>
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/game.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { display: grid; place-items: center; min-height: 100vh; overflow: hidden; }
    #game-container { width: min(94vw, 1180px); display: flex; flex-direction: column; gap: 16px; }
    .game-area { position: relative; width: 100%; }
    .header { display: flex; justify-content: space-between; align-items: flex-end; }
    .header .scores { display: flex; gap: 32px; text-align: right; }
    .board {
      position: relative;
      border-radius: 22px; overflow: hidden;
      border: 1px solid var(--gh-line-strong);
      background: #0a0410;
      box-shadow: 0 40px 100px -40px var(--gh-accent-glow);
    }
    canvas { display: block; width: 100%; height: auto; aspect-ratio: 540 / 300; }
    .controls { display: none; }
    .header .scores > div { min-width: 56px; }
    canvas { touch-action: none; }
    @media (max-width: 820px) {
      body { place-items: start center; }
      #game-container { width: 100vw; padding: calc(10px + env(safe-area-inset-top)) 8px 0; gap: 10px; }
      .header { flex-wrap: wrap; gap: 8px; }
      .header .scores { gap: 14px; }
      .header .gh-value { font-size: 17px; }
      .board { border-radius: 14px; }
      .hint { display: none; }
    }
    .hint { text-align: center; color: var(--gh-text-3); font-size: 13px; }
    #overlay { position: absolute; }
    #overlay h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: -0.04em; }
    #overlay p { margin: 0 0 18px; color: var(--gh-text-2); }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="header">
      <a href="/" class="gh-back">← Bibliothek</a>
      <div class="scores">
        <div><span class="gh-label">Level</span><div class="gh-value" id="level">1</div></div>
        <div><span class="gh-label">Labyrinth</span><div class="gh-value" id="maze">Klassik</div></div>
        <div><span class="gh-label">Punkte</span><div class="gh-value" id="score">0</div></div>
        <div><span class="gh-label">Leben</span><div class="gh-value" id="lives">3</div></div>
        <div><span class="gh-label">Bestwert</span><div class="gh-value" id="best">0</div></div>
      </div>
    </div>
    <div class="board game-area">
      <canvas id="canvas"></canvas>
      <div id="overlay" class="gh-overlay">
        <div class="gh-overlay-card">
          <h1 id="overlay-title">Pac Man</h1>
          <p id="overlay-sub">Drei Labyrinthe – jedes Level werden die Geister schneller.</p>
          <button id="start-btn" class="gh-btn gh-btn-white">Spiel starten</button>
        </div>
      </div>
    </div>
    <p class="hint kbd-hint"><kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> steuern · <kbd>Enter</kbd> starten · <kbd>P</kbd> Pause</p>
  </div>

<script src="/assets/js/touch.js"></script>
<script src="/games/pacman/core.js"></script>
<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const T = PacCore.TILE, W = 27 * T, H = 15 * T;
  const game = new PacCore();
  const $ = (id) => document.getElementById(id);
  let paused = false;

  function fitCanvas() {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.width * (H / W) * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    draw();
  }
  addEventListener('resize', fitCanvas);

  const best = () => (window.GHStats && GHStats.best('pacman')) || 0;
  function hud() {
    $('score').textContent = game.score.toLocaleString('de-DE');
    $('lives').textContent = game.lives;
    $('level').textContent = game.level;
    $('maze').textContent = game.mazeName;
    $('best').textContent = best().toLocaleString('de-DE');
  }

  function draw() {
    ctx.fillStyle = '#0a0410';
    ctx.fillRect(0, 0, W, H);
    const t = performance.now();
    const g = game.grid;
    // Wände
    ctx.fillStyle = '#1b1023';
    for (let r = 0; r < 15; r++) for (let c = 0; c < 27; c++) if (g[r][c] === 1) ctx.fillRect(c * T, r * T, T, T);
    ctx.save();
    ctx.strokeStyle = '#e254d6'; ctx.lineWidth = 1.6; ctx.shadowColor = '#e254d6'; ctx.shadowBlur = 8;
    ctx.beginPath();
    const open = (r, c) => r >= 0 && r < 15 && c >= 0 && c < 27 && g[r][c] !== 1;
    for (let r = 0; r < 15; r++) for (let c = 0; c < 27; c++) {
      if (g[r][c] !== 1) continue;
      const x = c * T, y = r * T, i = 3;
      if (open(r - 1, c)) { ctx.moveTo(x, y + i); ctx.lineTo(x + T, y + i); }
      if (open(r + 1, c)) { ctx.moveTo(x, y + T - i); ctx.lineTo(x + T, y + T - i); }
      if (open(r, c - 1)) { ctx.moveTo(x + i, y); ctx.lineTo(x + i, y + T); }
      if (open(r, c + 1)) { ctx.moveTo(x + T - i, y); ctx.lineTo(x + T - i, y + T); }
    }
    ctx.stroke();
    ctx.restore();
    // Tür
    for (let r = 0; r < 15; r++) for (let c = 0; c < 27; c++) if (g[r][c] === 4) { ctx.fillStyle = '#ff8aa0'; ctx.fillRect(c * T + 2, r * T + 8, T - 4, 3); }
    // Punkte
    for (let r = 0; r < 15; r++) for (let c = 0; c < 27; c++) {
      if (g[r][c] === 2) { ctx.fillStyle = 'rgba(246,242,249,0.75)'; ctx.beginPath(); ctx.arc(c * T + 10, r * T + 10, 2.2, 0, Math.PI * 2); ctx.fill(); }
      else if (g[r][c] === 3) {
        ctx.save(); ctx.fillStyle = '#ffc857'; ctx.shadowColor = '#ffc857'; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.arc(c * T + 10, r * T + 10, 5 + Math.sin(t / 180) * 1.2, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      }
    }
    // Pac-Man
    const p = game.pac;
    const dying = game.state === 'dying';
    const mouth = dying ? Math.min(Math.PI, (90 - game.deathTimer) / 90 * Math.PI) : 0.05 + Math.abs(Math.sin(p.mouth)) * 0.32;
    const rot = p.dx === -1 ? Math.PI : p.dy === 1 ? 0.5 * Math.PI : p.dy === -1 ? 1.5 * Math.PI : (p.ndx === -1 ? Math.PI : 0);
    ctx.save();
    ctx.fillStyle = '#ffc857'; ctx.shadowColor = '#ffc857'; ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(p.x + 10, p.y + 10, 8, rot + mouth, rot + Math.PI * 2 - mouth);
    ctx.lineTo(p.x + 10, p.y + 10);
    ctx.fill();
    ctx.restore();
    // Geister
    if (!dying) game.ghosts.forEach((gh) => {
      if (gh.inHouse && game.state === 'play' && gh.release > 150) return;
      const scared = game.fright > 0;
      const blink = scared && game.fright < 60 && Math.floor(game.fright / 10) % 2 === 0;
      const col = scared ? (blink ? '#f6f2f9' : '#6366f1') : gh.color;
      ctx.save();
      ctx.globalAlpha = gh.inHouse ? 0.55 : 1;
      ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(gh.x + 10, gh.y + 9, 8, Math.PI, 0, false);
      ctx.lineTo(gh.x + 18, gh.y + 18);
      for (let k = 0; k < 3; k++) {
        const bx = gh.x + 18 - (k + 1) * (16 / 3);
        ctx.lineTo(bx + 16 / 6, gh.y + 15 + ((Math.floor(t / 120) + k) % 2) * 2);
        ctx.lineTo(bx, gh.y + 18);
      }
      ctx.closePath(); ctx.fill(); ctx.restore();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(gh.x + 7, gh.y + 9, 2.4, 0, Math.PI * 2); ctx.arc(gh.x + 13, gh.y + 9, 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#120816';
      ctx.beginPath(); ctx.arc(gh.x + 7 + gh.dx, gh.y + 9 + gh.dy, 1.2, 0, Math.PI * 2); ctx.arc(gh.x + 13 + gh.dx, gh.y + 9 + gh.dy, 1.2, 0, Math.PI * 2); ctx.fill();
    });
    // Ansagen
    if (game.state === 'ready' || game.state === 'clear') {
      ctx.fillStyle = game.state === 'clear' ? '#3ddc97' : '#ffc857';
      ctx.font = '700 14px Inter, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(game.state === 'clear' ? 'Level geschafft!' : (game.level > 1 ? 'Level ' + game.level + ' · ' + game.mazeName : 'Bereit!'), W / 2, 8.8 * T + 6);
    }
  }

  game.on('change', hud).on('eat', hud).on('power', hud).on('ghost', hud).on('level', hud).on('extralife', hud);
  game.on('over', (r) => {
    const prev = best();
    const res = window.GHStats ? GHStats.record('pacman', r.score) : { best: r.score };
    if (window.GHStats) GHStats.unlock('pacman', r.level);
    $('overlay-title').textContent = r.score > prev && r.score > 0 ? 'Neuer Rekord!' : 'Spiel vorbei';
    $('overlay-sub').textContent = r.score.toLocaleString('de-DE') + ' Punkte · Level ' + r.level + ' · Bestwert ' + res.best.toLocaleString('de-DE');
    $('start-btn').textContent = 'Nochmal spielen';
    $('overlay').style.display = 'grid';
    hud();
  });

  function start() {
    $('overlay').style.display = 'none';
    paused = false;
    game.newGame();
    hud();
  }
  $('start-btn').onclick = () => { if (paused) togglePause(); else start(); };
  function togglePause() {
    if (game.state === 'idle' || game.state === 'over') return;
    paused = !paused;
    $('overlay-title').textContent = 'Pause';
    $('overlay-sub').textContent = 'Drücke P, um weiterzuspielen.';
    $('start-btn').textContent = 'Weiter';
    $('overlay').style.display = paused ? 'grid' : 'none';
  }

  addEventListener('keydown', (e) => {
    if (e.key.startsWith('Arrow')) e.preventDefault();
    const k = e.key.toLowerCase();
    if (e.key === 'Enter' && (game.state === 'idle' || game.state === 'over')) return start();
    if (k === 'p' || e.key === 'Escape') return togglePause();
    if (e.key === 'ArrowUp' || k === 'w') game.setDir(0, -1);
    if (e.key === 'ArrowDown' || k === 's') game.setDir(0, 1);
    if (e.key === 'ArrowLeft' || k === 'a') game.setDir(-1, 0);
    if (e.key === 'ArrowRight' || k === 'd') game.setDir(1, 0);
  });
  GHTouch.swipe(canvas, { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' }, { min: 18 });
  GHTouch.dpad({ up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' }, { side: 'right' });

  // Feste 60 Schritte pro Sekunde, unabhängig von der Bildrate
  let last = performance.now(), acc = 0;
  function loop(t) {
    acc += Math.min(100, t - last); last = t;
    while (acc >= 1000 / 60) { if (!paused) game.update(); acc -= 1000 / 60; }
    draw();
    requestAnimationFrame(loop);
  }

  hud();
  fitCanvas();
  requestAnimationFrame(loop);
</script>
</body>
</html>
