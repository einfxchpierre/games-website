<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <script src="/assets/js/boot.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Minesweeper · GAMEHUB</title>
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="/assets/css/game.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }

        .game-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 20px; }
        .topline { width: 100%; max-width: 1180px; display: flex; justify-content: space-between; align-items: center; position: absolute; top: 24px; left: 50%; transform: translateX(-50%); padding: 0 24px; }
        .game-headline { font-size: 44px; font-weight: 700; letter-spacing: -0.045em; text-align: center; }
        .game-headline span { color: var(--gh-accent); }

        .controls-card { width: 100%; max-width: 620px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }

        .btn {
            flex: 1; height: 36px; padding: 0 14px;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            border: 1px solid var(--gh-line-strong); border-radius: 999px;
            background: transparent; color: var(--gh-text-2);
            font: 600 13.5px var(--gh-font); cursor: pointer;
            transition: background .15s, color .15s, border-color .15s;
        }
        .btn:hover { color: var(--gh-text); background: rgba(255,255,255,0.04); }
        .difficulty-buttons { display: flex; gap: 8px; }
        .difficulty-buttons .btn.active { background: #fff; border-color: #fff; color: #120816; }

        .status-bar {
            display: grid; grid-template-columns: 1fr 1fr;
            border-top: 1px solid var(--gh-line); border-bottom: 1px solid var(--gh-line);
        }
        .status-item { padding: 12px 0; display: flex; flex-direction: column; gap: 4px; }
        .status-item + .status-item { padding-left: 18px; border-left: 1px solid var(--gh-line); }
        .status-item b { font-size: 20px; font-variant-numeric: tabular-nums; }

        .tool-switcher { display: flex; gap: 8px; }
        .tool-btn {
            flex: 1; height: 40px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            border: 1px solid var(--gh-line-strong); border-radius: 12px;
            background: transparent; color: var(--gh-text-2);
            font: 600 13.5px var(--gh-font); cursor: pointer;
        }
        .tool-btn.active { border-color: var(--gh-accent); background: var(--gh-accent-soft); color: var(--gh-text); }
        .tool-btn i { color: var(--gh-accent); }

        .grid-container { overflow-x: auto; max-width: 100%; padding: 4px; }
        .mines-grid {
            display: grid; gap: 4px; margin: 0 auto; padding: 8px;
            border: 1px solid var(--gh-line-strong); border-radius: 16px;
            background: rgba(10, 4, 16, 0.6);
            box-shadow: 0 40px 100px -40px var(--gh-accent-glow);
            user-select: none;
        }
        .cell {
            width: var(--cell, 35px); height: var(--cell, 35px);
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px;
            background: linear-gradient(180deg, #2a1a33, #1f1428);
            border: 1px solid rgba(255,255,255,0.05);
            font-weight: 800; font-size: 1.05rem;
            cursor: pointer;
            transition: background .12s, transform .12s;
        }
        .cell:hover { background: linear-gradient(180deg, #3a2445, #2a1a33); transform: translateY(-1px); }
        .cell.revealed { background: #0d0712; border-color: rgba(255,255,255,0.02); cursor: default; }
        .cell.revealed:hover { background: #0d0712; transform: none; }

        .cell[data-count="1"] { color: #38bdf8; }
        .cell[data-count="2"] { color: #3ddc97; }
        .cell[data-count="3"] { color: #ff5470; }
        .cell[data-count="4"] { color: #9b5cf6; }
        .cell[data-count="5"] { color: #ffc857; }
        .cell[data-count="6"] { color: #22d3ee; }
        .cell[data-count="7"] { color: #e254d6; }
        .cell[data-count="8"] { color: #f6f2f9; }

        .cell.mine { background: var(--gh-neg) !important; color: #fff; box-shadow: 0 0 14px rgba(255,84,112,.6); }
        .cell.flagged { color: var(--gh-accent); }

        #resultOverlay { position: fixed; display: none; }
        .cell { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
        @media (max-width: 820px) {
            body { align-items: flex-start; padding: 70px 8px 24px; }
            .topline { top: calc(14px + env(safe-area-inset-top)); padding: 0 12px; }
            .topline .gh-label { display: none; }
            .game-headline { font-size: 32px; }
            .controls-card { padding: 14px; }
            .difficulty-buttons { flex-wrap: wrap; }
            .difficulty-buttons .btn { flex: 1 1 40%; }
        }
    </style>
</head>
<body>

    <main class="game-wrapper">
        <div class="topline"><a href="/" class="gh-back">← Bibliothek</a><span class="gh-label">Rechtsklick oder lange drücken = Flagge</span></div>
        <h1 class="game-headline">Mine<span>sweeper</span></h1>

        <div class="controls-card gh-card">
            <div class="difficulty-buttons">
                <button class="btn btn-secondary active" onclick="changeDifficulty('easy', this)">Anfänger</button>
                <button class="btn btn-secondary" onclick="changeDifficulty('medium', this)">Normal</button>
                <button class="btn btn-secondary" onclick="changeDifficulty('hard', this)">Profi</button>
                <button class="btn btn-secondary" onclick="changeDifficulty('expert', this)">Experte</button>
            </div>

            <div class="status-bar">
                <div class="status-item">
                    <span class="gh-label">Minen übrig</span>
                    <b id="mineCount">0</b>
                </div>
                <div class="status-item">
                    <span class="gh-label">Zeit</span>
                    <b><span id="timerBox">000</span> s</b>
                </div>
            </div>

            <div class="tool-switcher">
                <button id="toolDig" class="tool-btn active" onclick="setTool('dig')">
                    <i class="fa-solid fa-shovel"></i> Ausbuddeln (Klick)
                </button>
                <button id="toolFlag" class="tool-btn" onclick="setTool('flag')">
                    <i class="fa-solid fa-flag"></i> Flagge setzen
                </button>
            </div>
        </div>

        <div class="grid-container">
            <div id="minesGrid" class="mines-grid"></div>
        </div>
    </main>

    <div id="resultOverlay" class="gh-overlay">
        <div class="gh-overlay-card">
            <h2 id="resTitle">Boom!</h2>
            <p id="resText"></p>
            <button class="gh-btn" onclick="document.getElementById('resultOverlay').style.display='none'">Feld ansehen</button>
            <button class="gh-btn gh-btn-white" onclick="document.getElementById('resultOverlay').style.display='none'; initGame();">Neues Spiel</button>
        </div>
    </div>

    <script>
        const config = {
            easy: { rows: 9, cols: 9, mines: 10 },
            medium: { rows: 13, cols: 15, mines: 40 },
            hard: { rows: 16, cols: 30, mines: 99 },
            expert: { rows: 20, cols: 30, mines: 145 }
        };

        let currentDiff = 'easy';
        let grid = [];
        let firstClick = true;
        let gameOver = false;
        let timer = null;
        let timeElapsed = 0;
        let activeTool = 'dig';
        let remainingMines = 10;

        document.addEventListener("DOMContentLoaded", () => {
            initGame();
        });

        function setTool(tool) {
            activeTool = tool;
            document.getElementById('toolDig').classList.toggle('active', tool === 'dig');
            document.getElementById('toolFlag').classList.toggle('active', tool === 'flag');
        }

        function changeDifficulty(diff, btn) {
            document.querySelectorAll('.difficulty-buttons .btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentDiff = diff;
            initGame();
        }

        // Zellgröße an Bildschirm anpassen (Handy: kleiner, bei Bedarf seitlich scrollen)
        function fitCells(cols) {
            const avail = Math.min(window.innerWidth - 40, 1180);
            const size = Math.max(window.GH_TOUCH ? 30 : 24, Math.min(35, Math.floor(avail / cols) - 4));
            document.documentElement.style.setProperty('--cell', size + 'px');
        }
        window.addEventListener('resize', () => fitCells(config[currentDiff].cols));
        const DIFF_NAMES = { easy: 'Anfänger', medium: 'Normal', hard: 'Profi', expert: 'Experte' };

        function initGame() {
            clearInterval(timer);
            timer = null;
            timeElapsed = 0;
            document.getElementById('timerBox').textContent = '000';

            firstClick = true;
            gameOver = false;
            remainingMines = config[currentDiff].mines;
            document.getElementById('mineCount').textContent = remainingMines;

            const gridElement = document.getElementById('minesGrid');
            gridElement.innerHTML = '';

            const rows = config[currentDiff].rows;
            const cols = config[currentDiff].cols;

            gridElement.style.gridTemplateColumns = `repeat(${cols}, var(--cell, 35px))`;
            fitCells(cols);

            grid = [];
            for (let r = 0; r < rows; r++) {
                grid[r] = [];
                for (let c = 0; c < cols; c++) {
                    const cellEl = document.createElement('div');
                    cellEl.classList.add('cell');
                    cellEl.dataset.row = r;
                    cellEl.dataset.col = c;

                    cellEl.addEventListener('click', () => handleCellClick(r, c));

                    cellEl.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        if (cellEl.dataset.lp === '1') return; // bereits per Langdruck markiert
                        handleCellInteraction(r, c, 'flag');
                    });

                    // Handy/Tablet: lange drücken = Flagge
                    let lpTimer = null;
                    cellEl.addEventListener('pointerdown', (e) => {
                        if (e.pointerType === 'mouse') return;
                        cellEl.dataset.lp = '0';
                        lpTimer = setTimeout(() => { cellEl.dataset.lp = '1'; handleCellInteraction(r, c, 'flag'); if (navigator.vibrate) navigator.vibrate(15); }, 420);
                    });
                    ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => cellEl.addEventListener(ev, () => clearTimeout(lpTimer)));
                    cellEl.addEventListener('click', (e) => { if (cellEl.dataset.lp === '1') { e.stopImmediatePropagation(); cellEl.dataset.lp = '0'; } }, true);

                    gridElement.appendChild(cellEl);

                    grid[r][c] = {
                        element: cellEl,
                        isMine: false,
                        isRevealed: false,
                        isFlagged: false,
                        count: 0
                    };
                }
            }
        }

        function handleCellClick(r, c) {
            handleCellInteraction(r, c, activeTool);
        }

        function handleCellInteraction(r, c, action) {
            if (gameOver) return;
            const cell = grid[r][c];
            if (cell.isRevealed) return;

            if (action === 'flag') {
                if (cell.isFlagged) {
                    cell.isFlagged = false;
                    cell.element.classList.remove('flagged');
                    cell.element.innerHTML = '';
                    remainingMines++;
                } else {
                    cell.isFlagged = true;
                    cell.element.classList.add('flagged');
                    cell.element.innerHTML = '<i class="fa-solid fa-flag"></i>';
                    remainingMines--;
                }
                document.getElementById('mineCount').textContent = remainingMines;
                checkWinCondition();
            } else if (action === 'dig') {
                if (cell.isFlagged) return;

                if (firstClick) {
                    firstClick = false;
                    startTimer();
                    generateMines(r, c);
                }

                if (cell.isMine) {
                    triggerGameOver(false);
                } else {
                    revealCell(r, c);
                    checkWinCondition();
                }
            }
        }

        function generateMines(startR, startC) {
            const rows = config[currentDiff].rows;
            const cols = config[currentDiff].cols;
            let minesToPlace = config[currentDiff].mines;

            while (minesToPlace > 0) {
                const randR = Math.floor(Math.random() * rows);
                const randY = Math.floor(Math.random() * cols);

                if (!grid[randR][randY].isMine && (randR !== startR || randY !== startC)) {
                    grid[randR][randY].isMine = true;
                    minesToPlace--;
                }
            }

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (!grid[r][c].isMine) {
                        grid[r][c].count = countNeighborMines(r, c);
                    }
                }
            }
        }

        function countNeighborMines(r, c) {
            let count = 0;
            const rows = config[currentDiff].rows;
            const cols = config[currentDiff].cols;

            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    const nr = r + i;
                    const nc = c + j;
                    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                        if (grid[nr][nc].isMine) count++;
                    }
                }
            }
            return count;
        }

        function revealCell(r, c) {
            const rows = config[currentDiff].rows;
            const cols = config[currentDiff].cols;

            if (r < 0 || r >= rows || c < 0 || c >= cols) return;
            const cell = grid[r][c];
            if (cell.isRevealed || cell.isFlagged || cell.isMine) return;

            cell.isRevealed = true;
            cell.element.classList.add('revealed');

            if (cell.count > 0) {
                cell.element.textContent = cell.count;
                cell.element.setAttribute('data-count', cell.count);
            } else {
                // Rekursiver Aufruf für Nachbarfelder / Recursive call for neighbor cells
                for (let i = -1; i <= 1; i++) {
                    for (let j = -1; j <= 1; j++) {
                        revealCell(r + i, c + j);
                    }
                }
            }
        }

        function startTimer() {
            timer = setInterval(() => {
                timeElapsed++;
                let displayTime = timeElapsed;
                if (displayTime > 999) displayTime = 999;
                document.getElementById('timerBox').textContent = String(displayTime).padStart(3, '0');
            }, 1000);
        }

        function triggerGameOver(isWin) {
            gameOver = true;
            clearInterval(timer);

            for (let r = 0; r < config[currentDiff].rows; r++) {
                for (let c = 0; c < config[currentDiff].cols; c++) {
                    if (grid[r][c].isMine) {
                        grid[r][c].element.classList.add('mine');
                        grid[r][c].element.innerHTML = '<i class="fa-solid fa-land-mine-on"></i>';
                    }
                }
            }

            setTimeout(() => {
                let bestNote = '';
                if (isWin && window.GHStats) {
                    GHStats.record('minesweeper', timeElapsed, { lowerIsBetter: true });
                    const k = 'best_' + currentDiff, prev = GHStats.progress('minesweeper', k);
                    if (prev == null || timeElapsed < prev) { GHStats.progress('minesweeper', k, timeElapsed); bestNote = ' Neue Bestzeit für ' + DIFF_NAMES[currentDiff] + '!'; }
                    else bestNote = ' Bestzeit ' + DIFF_NAMES[currentDiff] + ': ' + prev + ' s.';
                }
                document.getElementById('resTitle').textContent = isWin ? 'Gewonnen!' : 'Boom!';
                document.getElementById('resText').textContent = isWin
                    ? `Du hast das Feld in ${timeElapsed} Sekunden gelöst.` + bestNote
                    : 'Du hast eine Mine erwischt. Versuch es noch einmal!';
                document.getElementById('resultOverlay').style.display = 'grid';
            }, 200);
        }

        function checkWinCondition() {
            let won = true;
            for (let r = 0; r < config[currentDiff].rows; r++) {
                for (let c = 0; c < config[currentDiff].cols; c++) {
                    const cell = grid[r][c];
                    if (!cell.isMine && !cell.isRevealed) {
                        won = false;
                        break;
                    }
                }
            }
            if (won) triggerGameOver(true);
        }
    </script>
</body>
</html>
