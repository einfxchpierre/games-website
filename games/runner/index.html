<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <script src="/assets/js/device-guard.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Runner · GAMEHUB</title>
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/css/game.css">
    <style>
        * { user-select: none; box-sizing: border-box; }
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }

        .hud {
            position: absolute; top: 16px; left: 16px; right: 16px; z-index: 10;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none;
        }
        .hud > * { pointer-events: auto; }
        .hud-left { display: flex; gap: 10px; align-items: center; }
        .pill {
            display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px;
            border: 1px solid var(--gh-line-strong); border-radius: 999px;
            background: rgba(10, 4, 16, 0.7); backdrop-filter: blur(10px);
            font-weight: 700; font-variant-numeric: tabular-nums;
        }
        .coin-dot { width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe39b, #ffc857 55%, #e0a02a); box-shadow: 0 0 10px rgba(255,200,87,.6); }
        .center { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); text-align: center; pointer-events: none; }
        #score { font-size: 56px; font-weight: 800; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 30px var(--gh-accent-glow); }
        #highscore { color: var(--gh-text-3); font-size: 13px; margin-top: 4px; }

        #pauseMenu {
            position: absolute; inset: 0; z-index: 100;
            display: none; place-items: center;
            background: rgba(6, 2, 10, 0.82); backdrop-filter: blur(8px);
            overflow-y: auto; padding: 40px 20px;
        }
        #pauseMenu.active { display: grid; }
        .shop { width: min(720px, 100%); }
        .shop h1 { margin: 0 0 4px; font-size: 34px; letter-spacing: -0.04em; }
        .shop .sub { color: var(--gh-text-2); margin: 0 0 6px; }
        .section-title { margin: 26px 0 12px; padding-bottom: 10px; border-bottom: 1px solid var(--gh-line); font-weight: 600; }
        .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
        .item-card {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            padding: 16px 12px 12px;
            border: 1px solid var(--gh-line); border-radius: 16px;
            background: linear-gradient(180deg, var(--gh-card), var(--gh-card-2));
            text-align: center;
        }
        .item-card .name { font-weight: 600; font-size: 14px; }
        .item-card .meta { color: var(--gh-text-3); font-size: 12px; }
        .skin-preview { width: 40px; height: 40px; border-radius: 12px; }
        .active-skin { outline: 2px solid #fff; outline-offset: 3px; }
        .price { color: var(--gh-warn); font-size: 12.5px; font-weight: 600; }
        .item-card .gh-btn { width: 100%; height: 32px; font-size: 12.5px; margin-top: 4px; }
        .item-card .gh-btn:disabled { opacity: .45; cursor: not-allowed; }
        .shop-actions { display: flex; justify-content: center; margin-top: 30px; }

        #powerTimer {
            position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
            width: min(420px, 60%); height: 8px; border-radius: 4px;
            background: rgba(255,255,255,0.08); display: none; overflow: hidden;
        }
        #powerBar { height: 100%; width: 100%; border-radius: 4px; }
        #powerLabel { position: absolute; bottom: 84px; left: 50%; transform: translateX(-50%); font-size: 12.5px; font-weight: 600; display: none; }

        .controls-hint { position: absolute; bottom: 20px; width: 100%; text-align: center; color: var(--gh-text-3); font-size: 13px; pointer-events: none; }

        #crash { display: none; position: fixed; }
    </style>
</head>
<body>

    <div class="hud">
        <div class="hud-left">
            <a href="/" class="gh-back">← Bibliothek</a>
            <div class="pill"><span class="coin-dot"></span><span id="coinCount">0</span></div>
        </div>
        <button class="gh-btn gh-btn-sm" onclick="togglePause()">Shop <kbd>Esc</kbd></button>
    </div>
    <div class="center">
        <div id="score">0</div>
        <div id="highscore">Bestwert: 0</div>
    </div>

    <div id="pauseMenu">
        <div class="shop">
            <span class="gh-label">Pause</span>
            <h1>Upgrades & Skins</h1>
            <p class="sub">Du hast <b id="shopCoins">0</b> Münzen.</p>

            <div class="section-title">Power-Ups</div>
            <div class="shop-grid" id="upgradeList"></div>

            <div class="section-title">Skins</div>
            <div class="shop-grid" id="skinList"></div>

            <div class="shop-actions"><button class="gh-btn gh-btn-white" onclick="togglePause()" style="height:46px;padding:0 40px">Weiterspielen</button></div>
        </div>
    </div>

    <div id="crash" class="gh-overlay">
        <div class="gh-overlay-card">
            <h2>Crash!</h2>
            <p id="crashText">0 Punkte</p>
            <button class="gh-btn gh-btn-white" onclick="restart()">Nochmal</button>
        </div>
    </div>

    <div id="powerLabel"></div>
    <div id="powerTimer"><div id="powerBar"></div></div>
    <div class="controls-hint"><kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> oder Klick links/rechts · <kbd>Esc</kbd> Shop</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let W = innerWidth, H = innerHeight;
        function setup() {
            W = innerWidth; H = innerHeight;
            const dpr = Math.min(devicePixelRatio || 1, 2);
            canvas.width = W * dpr; canvas.height = H * dpr;
            canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            lanes = [W * 0.5 - LANE_GAP, W * 0.5, W * 0.5 + LANE_GAP];
        }
        const LANE_GAP = Math.min(220, innerWidth * 0.18);
        let lanes = [];
        setup();
        addEventListener('resize', setup);

        // Skins im GAMEHUB-Farbschema
        const skins = [{ c: '#e254d6', p: 0, n: 'Magenta' }, { c: '#38bdf8', p: 50, n: 'Eis' }, { c: '#3ddc97', p: 150, n: 'Mint' }, { c: '#ffc857', p: 300, n: 'Gold' }, { c: '#f6f2f9', p: 500, n: 'Weiß' }];
        const POWERS = { god: { n: 'Unverwundbar', c: '#ffc857' }, mult: { n: 'Doppelte Punkte', c: '#3ddc97' }, mag: { n: 'Magnet', c: '#38bdf8' } };

        let coins = parseInt(localStorage.getItem('coins')) || 0;
        let highscore = parseInt(localStorage.getItem('highscore')) || 0;
        let unlockedSkins = JSON.parse(localStorage.getItem('unlockedSkins')) || [];
        if (!unlockedSkins.includes(skins[0].c)) unlockedSkins.push(skins[0].c);
        let playerColor = localStorage.getItem('selectedSkin');
        if (!skins.some(s => s.c === playerColor)) playerColor = skins[0].c;
        let upLevels = JSON.parse(localStorage.getItem('upLevels')) || { god: 5, mult: 5, mag: 5 };

        let score, speed, currentLane, playerX, isPaused = false, gameActive, entities, particles, t = 0;
        let activePower = null, powerTimeLeft = 0, powerMax = 0;

        function reset() {
            score = 0; speed = 7; currentLane = 1; playerX = lanes[1];
            gameActive = true; entities = []; particles = [];
            activePower = null;
            document.getElementById('powerTimer').style.display = 'none';
            document.getElementById('powerLabel').style.display = 'none';
            document.getElementById('score').innerText = 0;
        }

        function initShop() {
            document.getElementById('coinCount').innerText = coins;
            document.getElementById('shopCoins').innerText = coins;
            document.getElementById('highscore').innerText = 'Bestwert: ' + highscore;

            document.getElementById('skinList').innerHTML = skins.map(s => {
                const isU = unlockedSkins.includes(s.c), isA = playerColor === s.c;
                return `<div class="item-card">
                    <div class="skin-preview ${isA ? 'active-skin' : ''}" style="background:${s.c};box-shadow:0 0 18px ${s.c}66"></div>
                    <div class="name">${s.n}</div>
                    <div class="price">${isU ? 'Freigeschaltet' : s.p + ' Münzen'}</div>
                    <button class="gh-btn ${isU && !isA ? 'gh-btn-white' : ''}" ${isA || (!isU && coins < s.p) ? 'disabled' : ''} onclick="handleSkin('${s.c}',${s.p})">${isU ? (isA ? 'Aktiv' : 'Wählen') : 'Kaufen'}</button>
                </div>`;
            }).join('');

            document.getElementById('upgradeList').innerHTML = Object.keys(POWERS).map(id => {
                const cost = upLevels[id] * 10;
                return `<div class="item-card">
                    <div class="skin-preview" style="border-radius:50%;background:${POWERS[id].c};box-shadow:0 0 18px ${POWERS[id].c}66"></div>
                    <div class="name">${POWERS[id].n}</div>
                    <div class="meta">Dauer: ${upLevels[id]} s</div>
                    <div class="price">${cost} Münzen</div>
                    <button class="gh-btn gh-btn-white" ${coins < cost ? 'disabled' : ''} onclick="handleUpgrade('${id}',${cost})">Verbessern</button>
                </div>`;
            }).join('');
        }

        function handleSkin(c, p) {
            if (unlockedSkins.includes(c)) { playerColor = c; localStorage.setItem('selectedSkin', c); }
            else if (coins >= p) { coins -= p; unlockedSkins.push(c); playerColor = c; localStorage.setItem('selectedSkin', c); save(); }
            initShop();
        }
        function handleUpgrade(id, cost) {
            if (coins >= cost) { coins -= cost; upLevels[id] += 2; save(); initShop(); }
        }
        function save() {
            localStorage.setItem('coins', coins);
            localStorage.setItem('unlockedSkins', JSON.stringify(unlockedSkins));
            localStorage.setItem('upLevels', JSON.stringify(upLevels));
            localStorage.setItem('highscore', highscore);
        }

        function togglePause() {
            if (!gameActive) return;
            isPaused = !isPaused;
            document.getElementById('pauseMenu').classList.toggle('active', isPaused);
            if (!isPaused) requestAnimationFrame(update); else initShop();
        }

        /* ---------- Steuerung ---------- */
        addEventListener('mousedown', e => {
            if (isPaused || !gameActive || e.target.closest('button, a, #pauseMenu')) return;
            movePlayer(e.clientX < W / 2 ? -1 : 1);
        });
        addEventListener('keydown', e => {
            if (e.key === 'Escape') { togglePause(); return; }
            if (!gameActive && (e.key === 'Enter' || e.key === ' ')) { restart(); return; }
            if (isPaused || !gameActive) return;
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') movePlayer(-1);
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') movePlayer(1);
        });
        function movePlayer(dir) {
            if (dir === -1 && currentLane > 0) currentLane--;
            else if (dir === 1 && currentLane < 2) currentLane++;
        }

        function spawn() {
            if (isPaused || !gameActive) return setTimeout(spawn, 500);
            const r = Math.random(), lane = Math.floor(Math.random() * 3);
            if (r < 0.6) entities.push({ x: lanes[lane] - 30, y: -60, w: 60, h: 60, type: 'obs' });
            else if (r < 0.9) entities.push({ x: lanes[lane] - 15, y: -60, w: 30, h: 30, type: 'coin' });
            else entities.push({ x: lanes[lane] - 20, y: -60, w: 40, h: 40, type: ['p_god', 'p_mult', 'p_mag'][Math.floor(Math.random() * 3)] });
            setTimeout(spawn, Math.max(300, 900 - score * 2));
        }

        /* ---------- Zeichnen ---------- */
        function rr(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
        }

        function drawTrack() {
            const g = ctx.createLinearGradient(0, 0, 0, H);
            g.addColorStop(0, '#06020a'); g.addColorStop(0.7, '#14061d'); g.addColorStop(1, '#3a0d41');
            ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

            // Fahrbahn
            const left = lanes[0] - LANE_GAP / 2, right = lanes[2] + LANE_GAP / 2;
            ctx.fillStyle = 'rgba(27,16,35,0.65)';
            ctx.fillRect(left, 0, right - left, H);
            // Spurlinien
            ctx.strokeStyle = 'rgba(226,84,214,0.5)'; ctx.lineWidth = 2;
            ctx.shadowColor = '#e254d6'; ctx.shadowBlur = 12;
            [left, right].forEach(x => { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); });
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.setLineDash([30, 30]); ctx.lineDashOffset = -t * speed;
            [lanes[0] + LANE_GAP / 2, lanes[1] + LANE_GAP / 2].forEach(x => { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); });
            ctx.setLineDash([]);
            // Querlinien für Geschwindigkeitsgefühl
            ctx.strokeStyle = 'rgba(255,255,255,0.035)';
            const step = 90, off = (t * speed) % step;
            for (let y = off - step; y < H; y += step) { ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke(); }
        }

        function update() {
            if (isPaused || !gameActive) return;
            t++;
            drawTrack();

            if (activePower) {
                powerTimeLeft -= 0.016;
                document.getElementById('powerBar').style.width = (powerTimeLeft / powerMax) * 100 + '%';
                if (powerTimeLeft <= 0) {
                    activePower = null;
                    document.getElementById('powerTimer').style.display = 'none';
                    document.getElementById('powerLabel').style.display = 'none';
                }
            }

            // Spieler (gleitet weich zwischen den Spuren)
            playerX += (lanes[currentLane] - playerX) * 0.3;
            const py = H - 150;
            ctx.save();
            if (activePower === 'god') ctx.globalAlpha = 0.55 + Math.sin(t * 0.3) * 0.2;
            ctx.shadowBlur = 28; ctx.shadowColor = playerColor;
            const pg = ctx.createLinearGradient(0, py, 0, py + 80);
            pg.addColorStop(0, '#ffffff'); pg.addColorStop(0.25, playerColor); pg.addColorStop(1, playerColor);
            ctx.fillStyle = pg;
            rr(playerX - 30, py, 60, 80, 16); ctx.fill();
            ctx.restore();
            if (activePower === 'mag') {
                ctx.strokeStyle = 'rgba(56,189,248,0.35)'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(playerX, py + 40, 70 + Math.sin(t * 0.2) * 6, 0, Math.PI * 2); ctx.stroke();
            }

            for (let i = entities.length - 1; i >= 0; i--) {
                const e = entities[i]; e.y += speed;
                if (activePower === 'mag' && e.type === 'coin') e.x += (lanes[currentLane] - (e.x + 15)) * 0.15;

                if (e.type === 'obs') {
                    ctx.save();
                    ctx.shadowColor = '#ff5470'; ctx.shadowBlur = 22;
                    const og = ctx.createLinearGradient(0, e.y, 0, e.y + e.h);
                    og.addColorStop(0, '#ff7a91'); og.addColorStop(1, '#d92b4b');
                    ctx.fillStyle = og;
                    rr(e.x, e.y, e.w, e.h, 12); ctx.fill();
                    ctx.restore();
                    if (activePower !== 'god' && e.y + e.h > py && e.y < py + 80 && Math.abs((e.x + 30) - lanes[currentLane]) < 25) {
                        return crash();
                    }
                } else {
                    const color = e.type === 'coin' ? '#ffc857' : POWERS[e.type.split('_')[1]].c;
                    ctx.save();
                    ctx.shadowColor = color; ctx.shadowBlur = 18; ctx.fillStyle = color;
                    ctx.beginPath(); ctx.arc(e.x + e.w / 2, e.y + e.h / 2, e.w / 2, 0, Math.PI * 2); ctx.fill();
                    if (e.type !== 'coin') { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
                    ctx.restore();
                    if (e.y + e.h > py && e.y < py + 80 && Math.abs((e.x + e.w / 2) - lanes[currentLane]) < 30) {
                        if (e.type === 'coin') coins += (activePower === 'mult' ? 2 : 1);
                        else {
                            activePower = e.type.split('_')[1];
                            powerMax = upLevels[activePower]; powerTimeLeft = powerMax;
                            document.getElementById('powerTimer').style.display = 'block';
                            document.getElementById('powerBar').style.background = color;
                            const lbl = document.getElementById('powerLabel');
                            lbl.style.display = 'block'; lbl.style.color = color; lbl.innerText = POWERS[activePower].n;
                        }
                        for (let k = 0; k < 10; k++) particles.push({ x: e.x + e.w / 2, y: e.y + e.h / 2, vx: (Math.random() - .5) * 8, vy: (Math.random() - .5) * 8, l: 20, c: color });
                        entities.splice(i, 1); save(); document.getElementById('coinCount').innerText = coins; continue;
                    }
                }
                if (e.y > H) {
                    if (e.type === 'obs') { score += (activePower === 'mult' ? 2 : 1); speed += 0.02; document.getElementById('score').innerText = score; }
                    entities.splice(i, 1);
                }
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i]; p.x += p.vx; p.y += p.vy; p.l--;
                ctx.globalAlpha = p.l / 20; ctx.fillStyle = p.c;
                ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
                if (p.l <= 0) particles.splice(i, 1);
            }
            ctx.globalAlpha = 1;
            requestAnimationFrame(update);
        }

        function crash() {
            gameActive = false;
            if (score > highscore) highscore = score;
            save();
            document.getElementById('highscore').innerText = 'Bestwert: ' + highscore;
            document.getElementById('crashText').innerText = score + ' Punkte · Bestwert ' + highscore;
            document.getElementById('crash').style.display = 'grid';
        }
        function restart() {
            document.getElementById('crash').style.display = 'none';
            reset();
            requestAnimationFrame(update);
        }

        reset(); initShop(); spawn(); update();

        /* ---------- Sound ---------- */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, duration, type = 'square') {
            if (isPaused || !gameActive) return;
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }
        function musicLoop() {
            if (!isPaused && gameActive && audioCtx.state === 'running') {
                const notes = [110, 110, 164, 110, 130, 110, 146, 123];
                playTone(notes[Math.floor((Date.now() / 150) % notes.length)], 0.1);
            }
            setTimeout(musicLoop, 150);
        }
        addEventListener('mousedown', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });
        addEventListener('keydown', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });
        musicLoop();
    </script>
</body>
</html>
