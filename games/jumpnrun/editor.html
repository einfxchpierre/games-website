<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <script src="/assets/js/boot.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level-Editor · Jump'n Run · GAMEHUB</title>
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/css/game.css">
    <link rel="stylesheet" href="/games/jumpnrun/style.css">
</head>
<body style="overflow: auto;">
    <div id="editor-ui">
        <a href="/games/jumpnrun/play.html" class="gh-back gh-keep" style="margin-right:8px">← Jump'n Run</a>
        <button class="tool active" data-type="S" title="Startpunkt">S<small>Start</small></button>
        <button class="tool" data-type="#" title="Block">#<small>Block</small></button>
        <button class="tool" data-type="-" title="Plattform">-<small>Plattf.</small></button>
        <button class="tool" data-type="C" title="Münze">C<small>Münze</small></button>
        <button class="tool" data-type="E" title="Gegner">E<small>Gegner</small></button>
        <button class="tool" data-type="X" title="Wendepunkt">X<small>Wende</small></button>
        <button class="tool" data-type="P" title="Checkpoint">P<small>Check</small></button>
        <button class="tool" data-type="F" title="Ziel">F<small>Ziel</small></button>
        <button class="tool" data-type=" " title="Löschen">⌫<small>Löschen</small></button>

        <div style="flex-grow: 1;"></div>

        <button class="gh-btn gh-btn-sm" onclick="openIO('import')">Laden</button>
        <button class="gh-btn gh-btn-sm gh-btn-white" onclick="openIO('export')">Code exportieren</button>
    </div>

    <div id="editor-container">
        <div id="grid"></div>
    </div>

    <div id="io-modal" class="hidden">
        <div class="gh-overlay-card">
            <h2 id="modal-title">Level Code</h2>
            <textarea id="io-area" spellcheck="false"></textarea>
            <div style="display:flex; gap:10px; justify-content:flex-end">
                <button onclick="closeModal()" class="gh-btn">Schließen</button>
                <button id="modal-confirm" class="gh-btn gh-btn-white">Importieren</button>
            </div>
        </div>
    </div>

    <script src="/games/jumpnrun/editor.js"></script>
</body>
</html>
