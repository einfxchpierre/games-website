<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <script src="/assets/js/boot.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pac Man 3D · GAMEHUB</title>
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/css/game.css">
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; }
        .banner { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 15; font-size: 28px; font-weight: 800; color: var(--gh-warn); text-shadow: 0 0 24px rgba(255,200,87,.6); pointer-events: none; opacity: 0; transition: opacity .2s; }
        .banner.show { opacity: 1; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="scene" class="gh-scene"></div>
    <div class="gh-hud">
        <div class="gh-hud-group">
            <a href="/" class="gh-back">← Bibliothek</a>
            <div class="gh-hud-stat"><span class="gh-label">Level</span><b id="level">1</b></div>
            <div class="gh-hud-stat"><span class="gh-label">Labyrinth</span><b id="maze">Klassik</b></div>
            <div class="gh-hud-stat"><span class="gh-label">Punkte</span><b id="score">0</b></div>
            <div class="gh-hud-stat"><span class="gh-label">Leben</span><b id="lives">3</b></div>
            <div class="gh-hud-stat"><span class="gh-label">Bestwert</span><b id="best">0</b></div>
        </div>
    </div>
    <div class="banner" id="banner">Bereit!</div>

    <div class="gh-overlay fixed" id="overlay">
        <div class="gh-overlay-card">
            <span class="gh-label">Arcade · 3D</span>
            <h2 id="ovTitle">Pac Man 3D</h2>
            <p id="ovText">Drei Labyrinthe – jedes Level werden die Geister schneller.</p>
            <button class="gh-btn gh-btn-white" id="btnStart">Spiel starten</button>
        </div>
    </div>

    <div class="gh-hint3d"><kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> / <kbd>WASD</kbd> steuern · <kbd>P</kbd> Pause · Rechte Maustaste: Kamera</div>
    <div class="gh-loading" id="loading"><div><div class="gh-spinner"></div><span class="gh-label">Labyrinth wird gebaut …</span></div></div>

    <script src="/assets/js/touch.js"></script>
    <script src="/assets/js/gh3d.js"></script>
    <script src="/games/pacman/core.js"></script>
    <script src="/games/pacman-3d/game.js"></script>
</body>
</html>
