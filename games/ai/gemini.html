<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phönix-Duell</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --panel-bg: #1e1e24;
            --primary: #ff4500;
            --text: #f0f0f0;
            --mana: #00bfff;
            --hp: #32cd32;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); overflow: hidden; touch-action: manipulation; }
        
        /* Screens */
        .screen { display: none; width: 100vw; height: 100vh; flex-direction: column; align-items: center; justify-content: center; position: absolute; top: 0; left: 0; }
        .screen.active { display: flex; }
        
        /* UI Elements */
        h1 { font-size: 3rem; color: var(--primary); text-shadow: 0 0 10px rgba(255, 69, 0, 0.5); margin-bottom: 20px; text-align: center; }
        button { background: var(--panel-bg); color: var(--text); border: 2px solid var(--primary); padding: 15px 30px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; transition: 0.2s; margin: 10px; font-weight: bold; }
        button:hover { background: var(--primary); color: white; box-shadow: 0 0 15px var(--primary); }
        button:disabled { opacity: 0.5; cursor: not-allowed; border-color: #555; background: #333; box-shadow: none; }
        
        /* Animations */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shake { animation: shake 0.4s; }
        .damage-text { position: absolute; color: red; font-size: 2rem; font-weight: bold; pointer-events: none; animation: floatUp 1s ease-out forwards; z-index: 100; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-50px); } }
        
        /* Combat Layout */
        #combat-ui { display: flex; flex-direction: column; width: 100%; height: 100%; max-width: 800px; padding: 10px; }
        .combat-header, .combat-footer { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: var(--panel-bg); border-radius: 8px; }
        .stats-bar { width: 100px; height: 15px; background: #333; border-radius: 5px; overflow: hidden; margin-top: 5px; position: relative; }
        .hp-fill { height: 100%; background: var(--hp); transition: width 0.3s; }
        .mana-fill { height: 100%; background: var(--mana); transition: width 0.3s; }
        .bar-text { position: absolute; top: 0; left: 0; width: 100%; font-size: 0.7rem; text-align: center; line-height: 15px; font-weight: bold; }
        
        .combat-middle { flex: 1; display: flex; position: relative; overflow: hidden; }
        .arena { flex: 2; display: flex; flex-direction: column; justify-content: space-around; align-items: center; position: relative; }
        .entity { font-size: 5rem; transition: transform 0.2s; position: relative; }
        .combat-log { flex: 1; background: rgba(0,0,0,0.5); padding: 10px; overflow-y: auto; font-size: 0.9rem; border-left: 2px solid #333; }
        
        /* Cards */
        .cards-container { display: flex; justify-content: center; gap: 10px; padding: 10px 0; }
        .card { width: 80px; height: 120px; background: #222; border: 1px solid var(--primary); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; text-align: center; font-size: 0.8rem; padding: 5px; transition: transform 0.2s; }
        .card:hover { transform: translateY(-10px); background: #333; }
        .card-cost { color: var(--mana); font-weight: bold; margin-bottom: 5px; }
        
        /* Leaderboard */
        .leaderboard-list { width: 80%; max-height: 300px; overflow-y: auto; background: var(--panel-bg); padding: 10px; border-radius: 8px; margin-bottom: 20px; }
        .leaderboard-item { display: flex; justify-content: space-between; padding: 5px; border-bottom: 1px solid #444; }
    </style>
</head>
<body>

    <!-- Main Menu -->
    <div id="screen-menu" class="screen active">
        <h1>🔥 Phönix-Duell</h1>
        <button onclick="showScreen('screen-select')">Kämpfen</button>
        <button onclick="updateLeaderboardUI(); showScreen('screen-leaderboard')">Bestenliste</button>
        <!-- Language toggle placeholder -->
        <button style="border-color: #555; margin-top: 50px;">DE / EN</button>
    </div>

    <!-- Class Selection -->
    <div id="screen-select" class="screen">
        <h2>Wähle deine Kreatur</h2>
        <div style="display: flex; gap: 20px; margin: 20px;">
            <div style="text-align: center;">
                <div style="font-size: 4rem;">🦅</div>
                <h3>Phönix (Feuer)</h3>
                <p>HP: 100 | ATK: 15 | SPD: Fast</p>
                <button onclick="startCombat('Phönix', '🦅', 100, 15)">Auswählen</button>
            </div>
            <div style="text-align: center;">
                <div style="font-size: 4rem;">🐉</div>
                <h3>Drache (Blitz)</h3>
                <p>HP: 150 | ATK: 10 | SPD: Slow</p>
                <button onclick="startCombat('Drache', '🐉', 150, 10)">Auswählen</button>
            </div>
        </div>
        <button onclick="showScreen('screen-menu')">Zurück</button>
    </div>

    <!-- Combat Screen -->
    <div id="screen-combat" class="screen">
        <div id="combat-ui">
            <!-- Enemy Stats -->
            <div class="combat-header">
                <div>
                    <h3 id="enemy-name">Dämon 👿</h3>
                    <div class="stats-bar"><div id="enemy-hp-fill" class="hp-fill" style="width: 100%;"></div><div id="enemy-hp-text" class="bar-text">120/120</div></div>
                </div>
                <div>KI Turn: <span id="turn-indicator">Wartet...</span></div>
            </div>

            <!-- Arena & Log -->
            <div class="combat-middle">
                <div class="arena" id="arena">
                    <div id="enemy-sprite" class="entity">👿</div>
                    <div id="player-sprite" class="entity">🦅</div>
                </div>
                <div class="combat-log" id="combat-log">
                    <!-- Logs go here -->
                </div>
            </div>

            <!-- Player Stats & Cards -->
            <div>
                <div class="combat-header" style="background: none; padding: 0 10px;">
                    <div>
                        <h3 id="player-name">Phönix 🦅</h3>
                        <div class="stats-bar"><div id="player-hp-fill" class="hp-fill" style="width: 100%;"></div><div id="player-hp-text" class="bar-text">100/100</div></div>
                        <div class="stats-bar"><div id="player-mana-fill" class="mana-fill" style="width: 0%;"></div><div id="player-mana-text" class="bar-text">0/10</div></div>
                    </div>
                    <button onclick="surrender()" style="padding: 5px 15px; font-size: 0.9rem; border-color: red;">Aufgeben</button>
                </div>
                <div class="cards-container" id="cards-container">
                    <!-- Cards injected via JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="screen-result" class="screen">
        <h1 id="result-title">Sieg!</h1>
        <p id="result-stats">Schaden ausgeteilt: 120 | Runden: 5</p>
        <button onclick="showScreen('screen-menu')">Hauptmenü</button>
    </div>

    <!-- Leaderboard Screen -->
    <div id="screen-leaderboard" class="screen">
        <h2>Bestenliste</h2>
        <div class="leaderboard-list" id="leaderboard-list">
            <!-- Items injected via JS -->
        </div>
        <button onclick="showScreen('screen-menu')">Zurück</button>
    </div>

    <script>
        // --- State Management ---
        let state = {
            player: { name: '', sprite: '', hp: 100, maxHp: 100, mana: 2, maxMana: 10, atk: 10 },
            enemy: { name: 'Dämon', sprite: '👿', hp: 120, maxHp: 120, atk: 8 },
            rounds: 0,
            damageDealt: 0,
            isPlayerTurn: true,
            combatActive: false,
            manaTimer: null
        };

        // --- Deck / Cards ---
        const deck = [
            { id: 1, name: 'Feuerball', cost: 3, dmg: 20, type: 'attack' },
            { id: 2, name: 'Heilung', cost: 4, heal: 25, type: 'heal' },
            { id: 3, name: 'Kratzer', cost: 1, dmg: 8, type: 'attack' },
            { id: 4, name: 'Ultimate', cost: 8, dmg: 50, type: 'attack' }
        ];

        // --- Core Functions ---
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function log(msg) {
            const logBox = document.getElementById('combat-log');
            const entry = document.createElement('div');
            entry.style.marginBottom = '5px';
            entry.innerText = msg;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // --- Combat Logic ---
        function startCombat(name, sprite, hp, atk) {
            state.player = { name, sprite, hp, maxHp: hp, mana: 2, maxMana: 10, atk };
            state.enemy = { name: 'Schatten-Dämon', sprite: '👿', hp: 120, maxHp: 120, atk: 10 };
            state.rounds = 1;
            state.damageDealt = 0;
            state.isPlayerTurn = true;
            state.combatActive = true;

            document.getElementById('player-name').innerText = name + ' ' + sprite;
            document.getElementById('player-sprite').innerText = sprite;
            document.getElementById('enemy-sprite').innerText = state.enemy.sprite;
            document.getElementById('combat-log').innerHTML = '';
            
            log(`Kampf gestartet: ${name} vs ${state.enemy.name}`);
            updateUI();
            renderHand();
            showScreen('screen-combat');

            // Mana Regen Loop (1.5 Sekunden = +1 Mana)
            if(state.manaTimer) clearInterval(state.manaTimer);
            state.manaTimer = setInterval(() => {
                if(state.combatActive && state.player.mana < state.player.maxMana) {
                    state.player.mana++;
                    updateUI();
                    renderHand(); // Update card interactability
                }
            }, 1500);
        }

        function playCard(cardIndex) {
            if (!state.isPlayerTurn || !state.combatActive) return;
            const card = deck[cardIndex];
            
            if (state.player.mana < card.cost) {
                log("Nicht genug Mana!");
                return;
            }

            // Consume Mana & Process Card
            state.player.mana -= card.cost;
            log(`Du spielst ${card.name}!`);

            if (card.type === 'attack') {
                const dmg = card.dmg + Math.floor(Math.random() * state.player.atk);
                state.enemy.hp -= dmg;
                state.damageDealt += dmg;
                showDamage(dmg, 'enemy-sprite');
                triggerShake('enemy-sprite');
                log(`${state.enemy.name} erleidet ${dmg} Schaden.`);
            } else if (card.type === 'heal') {
                state.player.hp = Math.min(state.player.maxHp, state.player.hp + card.heal);
                log(`Du heilst dich um ${card.heal} HP.`);
            }

            updateUI();
            checkWinCondition();

            if (state.combatActive) {
                state.isPlayerTurn = false;
                document.getElementById('turn-indicator').innerText = 'Aktiv...';
                renderHand(); // Disable cards
                setTimeout(enemyTurn, 1500);
            }
        }

        function enemyTurn() {
            if (!state.combatActive) return;
            
            const dmg = state.enemy.atk + Math.floor(Math.random() * 5);
            state.player.hp -= dmg;
            showDamage(dmg, 'player-sprite');
            triggerShake('player-sprite');
            log(`${state.enemy.name} greift an für ${dmg} Schaden!`);
            
            state.rounds++;
            updateUI();
            checkWinCondition();

            if (state.combatActive) {
                state.isPlayerTurn = true;
                document.getElementById('turn-indicator').innerText = 'Wartet...';
                renderHand();
            }
        }

        function checkWinCondition() {
            if (state.enemy.hp <= 0) {
                endGame("Sieg", true);
            } else if (state.player.hp <= 0) {
                endGame("Niederlage", false);
            }
        }

        function surrender() {
            if(confirm("Willst du wirklich aufgeben?")) endGame("Aufgegeben", false);
        }

        function endGame(resultText, isWin) {
            state.combatActive = false;
            clearInterval(state.manaTimer);
            
            document.getElementById('result-title').innerText = resultText;
            document.getElementById('result-title').style.color = isWin ? 'var(--hp)' : 'red';
            document.getElementById('result-stats').innerText = `Schaden ausgeteilt: ${state.damageDealt} | Runden: ${state.rounds}`;
            
            saveToLeaderboard(resultText, state.damageDealt, state.rounds);
            showScreen('screen-result');
        }

        // --- Visuals & UI ---
        function updateUI() {
            // Player
            const pPct = Math.max(0, (state.player.hp / state.player.maxHp) * 100);
            document.getElementById('player-hp-fill').style.width = pPct + '%';
            document.getElementById('player-hp-text').innerText = `${Math.max(0, state.player.hp)}/${state.player.maxHp}`;
            
            const mPct = (state.player.mana / state.player.maxMana) * 100;
            document.getElementById('player-mana-fill').style.width = mPct + '%';
            document.getElementById('player-mana-text').innerText = `${state.player.mana}/${state.player.maxMana}`;

            // Enemy
            const ePct = Math.max(0, (state.enemy.hp / state.enemy.maxHp) * 100);
            document.getElementById('enemy-hp-fill').style.width = ePct + '%';
            document.getElementById('enemy-hp-text').innerText = `${Math.max(0, state.enemy.hp)}/${state.enemy.maxHp}`;
        }

        function renderHand() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            deck.forEach((card, index) => {
                const btn = document.createElement('div');
                btn.className = 'card';
                const canPlay = state.isPlayerTurn && state.player.mana >= card.cost;
                btn.style.opacity = canPlay ? '1' : '0.5';
                btn.style.pointerEvents = canPlay ? 'auto' : 'none';
                btn.innerHTML = `<div class="card-cost">🔵 ${card.cost}</div><div>${card.name}</div>`;
                btn.onclick = () => playCard(index);
                container.appendChild(btn);
            });
        }

        function triggerShake(elementId) {
            const el = document.getElementById(elementId);
            el.classList.remove('shake');
            void el.offsetWidth; // trigger reflow
            el.classList.add('shake');
        }

        function showDamage(amount, targetId) {
            const target = document.getElementById(targetId);
            const floating = document.createElement('div');
            floating.className = 'damage-text';
            floating.innerText = `-${amount}`;
            // Position slightly offset from center
            floating.style.top = '20%';
            floating.style.left = '40%';
            target.appendChild(floating);
            setTimeout(() => floating.remove(), 1000);
        }

        // --- Leaderboard (LocalStorage) ---
        function saveToLeaderboard(result, dmg, rounds) {
            const record = {
                date: new Date().toLocaleString(),
                result,
                dmg,
                rounds
            };
            let board = JSON.parse(localStorage.getItem('phoenixDuell_lb') || '[]');
            board.unshift(record);
            localStorage.setItem('phoenixDuell_lb', JSON.stringify(board));
        }

        function updateLeaderboardUI() {
            const list = document.getElementById('leaderboard-list');
            const board = JSON.parse(localStorage.getItem('phoenixDuell_lb') || '[]');
            list.innerHTML = board.length === 0 ? '<p>Noch keine Einträge.</p>' : '';
            board.forEach(b => {
                const color = b.result === 'Sieg' ? 'var(--hp)' : (b.result === 'Aufgegeben' ? '#888' : 'red');
                list.innerHTML += `<div class="leaderboard-item">
                    <span style="color: #aaa; font-size: 0.8rem;">${b.date}</span>
                    <strong style="color: ${color}">${b.result}</strong>
                    <span>⚔️ ${b.dmg} Dmg | 🔄 ${b.rounds} Runden</span>
                </div>`;
            });
        }
    </script>
</body>
</html>
