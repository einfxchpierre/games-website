<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Match 3 Deluxe</title>
    <style>
        :root {
            --cell-size-desktop: 60px;
            --cell-size-mobile: 11vw;
            --cell-gap: 5px;
            --grid-size: 8;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        h1 { margin: 10px 0; font-size: 1.8rem; text-align: center; }
        .score-board { font-size: 1.3rem; margin-bottom: 15px; }

        #game-container {
            position: relative;
            background-color: #2a2a40;
            padding: var(--cell-gap);
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            touch-action: none;
        }

        #grid {
            display: grid;
            gap: var(--cell-gap);
            grid-template-columns: repeat(var(--grid-size), var(--cell-size-mobile));
            grid-template-rows: repeat(var(--grid-size), var(--cell-size-mobile));
        }

        @media (min-width: 600px) {
            #grid {
                grid-template-columns: repeat(var(--grid-size), var(--cell-size-desktop));
                grid-template-rows: repeat(var(--grid-size), var(--cell-size-desktop));
            }
        }

        .tile {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            will-change: transform, opacity;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }

        .tile.selected {
            outline: 3px solid #ffffff;
            transform: scale(1.1);
            z-index: 10;
            box-shadow: 0 0 12px rgba(255,255,255,0.6);
        }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.6; filter: brightness(1.8); }
            100% { transform: scale(0); opacity: 0; }
        }

        @keyframes fallIn {
            0% { transform: translateY(-150%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .anim-explode { animation: explode 0.3s ease-out forwards; }
        .anim-fall { animation: fallIn 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        .tile::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            pointer-events: none;
            text-shadow: 0 0 4px rgba(0,0,0,0.8);
        }

        .tile.powerup-rocket-h::after { content: '🚀↔️'; }
        .tile.powerup-rocket-v::after { content: '🚀↕️'; }
        .tile.powerup-helicopter::after { content: '🚁'; }
        .tile.powerup-tnt::after { content: '🧨'; }
        .tile.powerup-disco::after { content: '🪩'; }
    </style>
</head>
<body>

    <h1>Match 3 Deluxe</h1>
    <div class="score-board">Punkte: <span id="score">0</span></div>
    
    <div id="game-container">
        <div id="grid"></div>
    </div>

    <script>
        const GRID_SIZE = 8;
        const gridElement = document.getElementById('grid');
        const scoreElement = document.getElementById('score');
        
        const STONES = [
            'https://zdpmsbnddyyheukujrtb.supabase.co/storage/v1/object/public/assets/pictures/icons/stone-blue.png',
            'https://zdpmsbnddyyheukujrtb.supabase.co/storage/v1/object/public/assets/pictures/icons/stone-green.png',
            'https://zdpmsbnddyyheukujrtb.supabase.co/storage/v1/object/public/assets/pictures/icons/stone-orange.png',
            'https://zdpmsbnddyyheukujrtb.supabase.co/storage/v1/object/public/assets/pictures/icons/stone-purple.png',
            'https://zdpmsbnddyyheukujrtb.supabase.co/storage/v1/object/public/assets/pictures/icons/stone-red.png',
            'https://zdpmsbnddyyheukujrtb.supabase.co/storage/v1/object/public/assets/pictures/icons/stone-turquoise.png',
            'https://zdpmsbnddyyheukujrtb.supabase.co/storage/v1/object/public/assets/pictures/icons/stone-yellow.png'
        ];

        const POWERUP = {
            ROCKET_H: 'rocket-h',
            ROCKET_V: 'rocket-v',
            HELICOPTER: 'helicopter',
            TNT: 'tnt',
            DISCO: 'disco'
        };

        let board = [];
        let selectedTile = null;
        let score = 0;
        let isProcessing = false;
        let lastMove = null;

        let touchStartX = 0;
        let touchStartY = 0;
        const SWIPE_THRESHOLD = 20;

        function getRandomStone() {
            return STONES[Math.floor(Math.random() * STONES.length)];
        }

        function createBoard() {
            board = [];
            gridElement.innerHTML = '';

            for (let r = 0; r < GRID_SIZE; r++) {
                const row = [];
                for (let c = 0; c < GRID_SIZE; c++) {
                    let stoneUrl;
                    do {
                        stoneUrl = getRandomStone();
                    } while (
                        (r >= 2 && board[r - 1][c].stone === stoneUrl && board[r - 2][c].stone === stoneUrl) ||
                        (c >= 2 && row[c - 1].stone === stoneUrl && row[c - 2].stone === stoneUrl)
                    );

                    row.push({ stone: stoneUrl, powerup: null });

                    const tileEl = document.createElement('div');
                    tileEl.classList.add('tile');
                    tileEl.dataset.row = r;
                    tileEl.dataset.col = c;
                    
                    tileEl.addEventListener('click', onTileClick);
                    tileEl.addEventListener('touchstart', onTouchStart, {passive: true});
                    tileEl.addEventListener('touchend', onTouchEnd, {passive: true});
                    
                    gridElement.appendChild(tileEl);
                }
                board.push(row);
            }
            updateRender();
        }

        function updateRender() {
            const tiles = document.querySelectorAll('.tile');
            tiles.forEach(tileEl => {
                const r = tileEl.dataset.row;
                const c = tileEl.dataset.col;
                const tileData = board[r][c];

                if (tileData && tileData.stone) {
                    tileEl.style.backgroundImage = `url("${tileData.stone}")`;
                } else {
                    tileEl.style.backgroundImage = 'none';
                }

                tileEl.className = 'tile';
                if (tileData && tileData.powerup) {
                    tileEl.classList.add(`powerup-${tileData.powerup}`);
                }
            });
        }

        function onTouchStart(e) {
            if (isProcessing) return;
            const touch = e.changedTouches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        }

        function onTouchEnd(e) {
            if (isProcessing) return;
            const touch = e.changedTouches[0];
            const distX = touch.clientX - touchStartX;
            const distY = touch.clientY - touchStartY;

            if (Math.abs(distX) < SWIPE_THRESHOLD && Math.abs(distY) < SWIPE_THRESHOLD) return;

            const tile = e.currentTarget;
            const r = parseInt(tile.dataset.row);
            const c = parseInt(tile.dataset.col);

            let targetR = r;
            let targetC = c;

            if (Math.abs(distX) > Math.abs(distY)) {
                targetC += distX > 0 ? 1 : -1;
            } else {
                targetR += distY > 0 ? 1 : -1;
            }

            if (targetR >= 0 && targetR < GRID_SIZE && targetC >= 0 && targetC < GRID_SIZE) {
                if (selectedTile) selectedTile.element.classList.remove('selected');
                selectedTile = { r, c, element: tile };
                executeMove(targetR, targetC);
            }
        }

        async function onTileClick(e) {
            if (isProcessing) return;

            const tile = e.currentTarget;
            const r = parseInt(tile.dataset.row);
            const c = parseInt(tile.dataset.col);

            if (!selectedTile) {
                selectedTile = { r, c, element: tile };
                tile.classList.add('selected');
            } else {
                const prevR = selectedTile.r;
                const prevC = selectedTile.c;
                const isAdjacent = Math.abs(prevR - r) + Math.abs(prevC - c) === 1;

                selectedTile.element.classList.remove('selected');

                if (isAdjacent) {
                    await executeMove(r, c);
                } else {
                    selectedTile = { r, c, element: tile };
                    tile.classList.add('selected');
                }
            }
        }

        async function executeMove(r, c) {
            isProcessing = true;
            const prevR = selectedTile.r;
            const prevC = selectedTile.c;
            selectedTile = null;

            lastMove = { fromR: prevR, fromC: prevC, toR: r, toC: c };

            animateSwap(prevR, prevC, r, c);
            await new Promise(res => setTimeout(res, 200));

            swapTiles(prevR, prevC, r, c);
            updateRender();
            resetSwapAnimation(prevR, prevC, r, c);

            const matchResult = detectMatchesAndPowerups();
            if (matchResult.matches.length > 0) {
                await handleMatches(matchResult);
            } else {
                animateSwap(prevR, prevC, r, c);
                await new Promise(res => setTimeout(res, 200));
                swapTiles(prevR, prevC, r, c);
                updateRender();
                resetSwapAnimation(prevR, prevC, r, c);
                isProcessing = false;
            }
        }

        function animateSwap(r1, c1, r2, c2) {
            const el1 = getTileEl(r1, c1);
            const el2 = getTileEl(r2, c2);
            
            const deltaX = (c2 - c1) * 100;
            const deltaY = (r2 - r1) * 100;

            el1.style.transform = `translate(${deltaX}%, ${deltaY}%)`;
            el2.style.transform = `translate(${-deltaX}%, ${-deltaY}%)`;
        }

        function resetSwapAnimation(r1, c1, r2, c2) {
            const el1 = getTileEl(r1, c1);
            const el2 = getTileEl(r2, c2);
            el1.style.transform = '';
            el2.style.transform = '';
        }

        function getTileEl(r, c) {
            return document.querySelector(`.tile[data-row="${r}"][data-col="${c}"]`);
        }

        function swapTiles(r1, c1, r2, c2) {
            const temp = board[r1][c1];
            board[r1][c1] = board[r2][c2];
            board[r2][c2] = temp;
        }

        function detectMatchesAndPowerups() {
            const matchedCoords = new Set();
            const hLines = [];
            const vLines = [];

            for (let r = 0; r < GRID_SIZE; r++) {
                let count = 1;
                for (let c = 1; c <= GRID_SIZE; c++) {
                    if (c < GRID_SIZE && board[r][c].stone && board[r][c].stone === board[r][c - 1].stone) {
                        count++;
                    } else {
                        if (count >= 3) {
                            const line = [];
                            for (let i = 0; i < count; i++) {
                                const col = c - 1 - i;
                                matchedCoords.add(`${r},${col}`);
                                line.push({ r, c: col });
                            }
                            hLines.push(line);
                        }
                        count = 1;
                    }
                }
            }

            for (let c = 0; c < GRID_SIZE; c++) {
                let count = 1;
                for (let r = 1; r <= GRID_SIZE; r++) {
                    if (r < GRID_SIZE && board[r][c].stone && board[r][c].stone === board[r - 1][c].stone) {
                        count++;
                    } else {
                        if (count >= 3) {
                            const line = [];
                            for (let i = 0; i < count; i++) {
                                const row = r - 1 - i;
                                matchedCoords.add(`${row},${c}`);
                                line.push({ r: row, c });
                            }
                            vLines.push(line);
                        }
                        count = 1;
                    }
                }
            }

            const newPowerups = [];
            const processedLines = new Set();

            // 5er-Reihe: Discokugel / 5-in-a-row: Disco Ball
            [...hLines, ...vLines].forEach(line => {
                if (line.length >= 5) {
                    const spawnTile = getPowerupSpawnTile(line);
                    newPowerups.push({ ...spawnTile, type: POWERUP.DISCO, stone: board[spawnTile.r][spawnTile.c].stone });
                    processedLines.add(line);
                }
            });

            // T-/L-Form (5 Steine, verteilt): TNT / T/L shape: TNT
            hLines.forEach(hLine => {
                if (processedLines.has(hLine)) return;
                vLines.forEach(vLine => {
                    if (processedLines.has(vLine)) return;
                    const intersection = hLine.find(h => vLine.some(v => v.r === h.r && v.c === h.c));
                    if (intersection) {
                        newPowerups.push({ r: intersection.r, c: intersection.c, type: POWERUP.TNT, stone: board[intersection.r][intersection.c].stone });
                        processedLines.add(hLine);
                        processedLines.add(vLine);
                    }
                });
            });

            // 2x2 Quadrat: Helikopter / 2x2 Square: Helicopter
            for (let r = 0; r < GRID_SIZE - 1; r++) {
                for (let c = 0; c < GRID_SIZE - 1; c++) {
                    const stone = board[r][c].stone;
                    if (stone && stone === board[r + 1][c].stone && stone === board[r][c + 1].stone && stone === board[r + 1][c + 1].stone) {
                        const squareCoords = [{ r, c }, { r: r + 1, c }, { r, c: c + 1 }, { r: r + 1, c: c + 1 }];
                        squareCoords.forEach(coord => matchedCoords.add(`${coord.r},${coord.c}`));
                        
                        const spawnTile = getPowerupSpawnTile(squareCoords);
                        newPowerups.push({ ...spawnTile, type: POWERUP.HELICOPTER, stone });
                    }
                }
            }

            // 4er-Reihe: Rakete (Gedrehte Flugrichtung) / 4-in-a-row: Rocket (Rotated flight direction)
            hLines.forEach(line => {
                if (!processedLines.has(line) && line.length === 4) {
                    const spawnTile = getPowerupSpawnTile(line);
                    newPowerups.push({ ...spawnTile, type: POWERUP.ROCKET_V, stone: board[spawnTile.r][spawnTile.c].stone });
                }
            });

            vLines.forEach(line => {
                if (!processedLines.has(line) && line.length === 4) {
                    const spawnTile = getPowerupSpawnTile(line);
                    newPowerups.push({ ...spawnTile, type: POWERUP.ROCKET_H, stone: board[spawnTile.r][spawnTile.c].stone });
                }
            });

            const matches = Array.from(matchedCoords).map(coord => {
                const [r, c] = coord.split(',').map(Number);
                return { r, c };
            });

            return { matches, newPowerups };
        }

        function getPowerupSpawnTile(coords) {
            if (lastMove) {
                const movedTile = coords.find(coord => (coord.r === lastMove.toR && coord.c === lastMove.toC) || (coord.r === lastMove.fromR && coord.c === lastMove.fromC));
                if (movedTile) return movedTile;
            }
            return coords[Math.floor(coords.length / 2)];
        }

        async function handleMatches(matchResult) {
            let currentMatches = matchResult.matches;
            let currentPowerups = matchResult.newPowerups;

            while (currentMatches.length > 0 || currentPowerups.length > 0) {
                const extraMatches = [];

                currentMatches.forEach(({ r, c }) => {
                    const tile = board[r][c];
                    if (tile.powerup) {
                        triggerPowerupEffect(r, c, tile.powerup, tile.stone, extraMatches);
                    }
                });

                const allDestroyed = [...currentMatches, ...extraMatches];
                score += allDestroyed.length * 10;
                scoreElement.textContent = score;

                allDestroyed.forEach(({ r, c }) => {
                    const el = getTileEl(r, c);
                    if (el) el.classList.add('anim-explode');
                });

                await new Promise(res => setTimeout(res, 300));

                allDestroyed.forEach(({ r, c }) => {
                    board[r][c] = { stone: null, powerup: null };
                });

                currentPowerups.forEach(p => {
                    board[p.r][p.c] = { stone: p.stone, powerup: p.type };
                });

                applyGravity();
                fillNewStonesWithAnimation();
                updateRender();

                await new Promise(res => setTimeout(res, 350));

                lastMove = null;
                const nextResult = detectMatchesAndPowerups();
                currentMatches = nextResult.matches;
                currentPowerups = nextResult.newPowerups;
            }

            isProcessing = false;
        }

        function triggerPowerupEffect(r, c, type, stoneColor, targetList) {
            // Horizontale Rakete / Horizontal Rocket
            if (type === POWERUP.ROCKET_H) {
                for (let col = 0; col < GRID_SIZE; col++) targetList.push({ r, c: col });
            }
            // Vertikale Rakete / Vertical Rocket
            else if (type === POWERUP.ROCKET_V) {
                for (let row = 0; row < GRID_SIZE; row++) targetList.push({ r: row, c });
            }
            // TNT: 4x3 Kern + Links/Rechts Ausläufer / TNT: 4x3 core + Left/Right extensions
            else if (type === POWERUP.TNT) {
                for (let row = r - 1; row <= r + 2; row++) {
                    for (let col = c - 1; col <= c + 1; col++) {
                        if (row >= 0 && row < GRID_SIZE && col >= 0 && col < GRID_SIZE) {
                            targetList.push({ r: row, c: col });
                        }
                    }
                }
                if (c - 2 >= 0) targetList.push({ r, c: c - 2 });
                if (c + 2 < GRID_SIZE) targetList.push({ r, c: c + 2 });
            }
// Helikopter: Gezielter Einzeltreffer / Helicopter: Targeted single hit
            else if (type === POWERUP.HELICOPTER) {
                let foundTarget = false;
                for (let row = 0; row < GRID_SIZE; row++) {
                    for (let col = 0; col < GRID_SIZE; col++) {
                        if ((row !== r || col !== c) && board[row][col].stone) {
                            targetList.push({ r: row, c: col });
                            foundTarget = true;
                            break;
                        }
                    }
                    if (foundTarget) break;
                }
            }
            // Discokugel: Alle Steine der selben Farbe / Disco Ball: All tiles of the same color
            else if (type === POWERUP.DISCO) {
                const targetColor = stoneColor || getRandomStone();
                for (let row = 0; row < GRID_SIZE; row++) {
                    for (let col = 0; col < GRID_SIZE; col++) {
                        if (board[row][col].stone === targetColor) {
                            targetList.push({ r: row, c: col });
                        }
                    }
                }
            }
        }

        function applyGravity() {
            for (let c = 0; c < GRID_SIZE; c++) {
                let emptyRow = GRID_SIZE - 1;
                for (let r = GRID_SIZE - 1; r >= 0; r--) {
                    if (board[r][c].stone !== null) {
                        board[emptyRow][c] = board[r][c];
                        if (emptyRow !== r) {
                            board[r][c] = { stone: null, powerup: null };
                        }
                        emptyRow--;
                    }
                }
            }
        }

        function fillNewStonesWithAnimation() {
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (board[r][c].stone === null) {
                        board[r][c] = { stone: getRandomStone(), powerup: null };
                        const el = getTileEl(r, c);
                        if (el) el.classList.add('anim-fall');
                    }
                }
            }
        }

        createBoard();
    </script>
</body>
</html>
