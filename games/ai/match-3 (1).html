<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match 3 Spiel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 10px;
        }

        .score-board {
            font-size: 24px;
            margin-bottom: 20px;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            gap: 5px;
            background-color: #2a2a40;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        .tile {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            user-select: none;
        }

        .tile:hover {
            transform: scale(1.05);
        }

        .tile.selected {
            outline: 3px solid #ffffff;
            transform: scale(1.1);
            z-index: 10;
        }
    </style>
</head>
<body>

    <h1>Match 3</h1>
    <div class="score-board">Punkte: <span id="score">0</span></div>
    <div id="grid"></div>

    <script>
        const GRID_SIZE = 8;
        const gridElement = document.getElementById('grid');
        const scoreElement = document.getElementById('score');
        
        const STONES = [
            'https://zdpmsbnddyyheukujrtb.supabase.co/storage/v1/object/public/assets/pictures/icons/stone-blue.png',
            'https://zdpmsbnddyyheukujrtb.supabase.co/storage/v1/object/public/assets/pictures/icons/stone-green.png',
            'https://zdpmsbnddyyheukujrtb.supabase.co/storage/v1/object/public/assets/pictures/icons/stone-orange.png',
            'https://zdpmsbnddyyheukujrtb.supabase.co/storage/v1/object/public/assets/pictures/icons/stone-purple.png',
            'https://zdpmsbnddyyheukujrtb.supabase.co/storage/v1/object/public/assets/pictures/icons/stone-red.png',
            'https://zdpmsbnddyyheukujrtb.supabase.co/storage/v1/object/public/assets/pictures/icons/stone-turquoise.png',
            'https://zdpmsbnddyyheukujrtb.supabase.co/storage/v1/object/public/assets/pictures/icons/stone-yellow.png'
        ];

        let board = [];
        let selectedTile = null;
        let score = 0;
        let isProcessing = false;

        function getRandomStone() {
            return STONES[Math.floor(Math.random() * STONES.length)];
        }

        function createBoard() {
            board = [];
            gridElement.innerHTML = '';

            for (let r = 0; r < GRID_SIZE; r++) {
                const row = [];
                for (let c = 0; c < GRID_SIZE; c++) {
                    let stone;
                    // Keine anfänglichen Dreierketten erzeugen / Avoid initial matches on spawn
                    do {
                        stone = getRandomStone();
                    } while (
                        (r >= 2 && board[r - 1][c] === stone && board[r - 2][c] === stone) ||
                        (c >= 2 && row[c - 1] === stone && row[c - 2] === stone)
                    );

                    row.push(stone);

                    const tile = document.createElement('div');
                    tile.classList.add('tile');
                    tile.dataset.row = r;
                    tile.dataset.col = c;
                    tile.style.backgroundImage = `url(${stone})`;
                    tile.addEventListener('click', onTileClick);
                    gridElement.appendChild(tile);
                }
                board.push(row);
            }
        }

        function updateRender() {
            const tiles = document.querySelectorAll('.tile');
            tiles.forEach(tile => {
                const r = tile.dataset.row;
                const c = tile.dataset.col;
                tile.style.backgroundImage = `url(${board[r][c]})`;
            });
        }

        async function onTileClick(e) {
            if (isProcessing) return;

            const tile = e.currentTarget;
            const r = parseInt(tile.dataset.row);
            const c = parseInt(tile.dataset.col);

            if (!selectedTile) {
                selectedTile = { r, c, element: tile };
                tile.classList.add('selected');
            } else {
                const prevR = selectedTile.r;
                const prevC = selectedTile.c;
                
                // Nachbarschaftsprüfung (oben, unten, links, rechts) / Check adjacency (up, down, left, right)
                const isAdjacent = Math.abs(prevR - r) + Math.abs(prevC - c) === 1;

                selectedTile.element.classList.remove('selected');

                if (isAdjacent) {
                    isProcessing = true;
                    swapTiles(prevR, prevC, r, c);
                    updateRender();

                    const matches = checkMatches();
                    if (matches.length > 0) {
                        await handleMatches();
                    } else {
                        // Rückgängig machen, falls kein Match entsteht / Swap back if no match formed
                        await new Promise(res => setTimeout(res, 250));
                        swapTiles(prevR, prevC, r, c);
                        updateRender();
                        isProcessing = false;
                    }
                }
                selectedTile = null;
            }
        }

        function swapTiles(r1, c1, r2, c2) {
            const temp = board[r1][c1];
            board[r1][c1] = board[r2][c2];
            board[r2][c2] = temp;
        }

        function checkMatches() {
            const matchedCoords = new Set();

            // Horizontale Treffer prüfen / Check horizontal matches
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE - 2; c++) {
                    const stone = board[r][c];
                    if (stone && stone === board[r][c + 1] && stone === board[r][c + 2]) {
                        matchedCoords.add(`${r},${c}`);
                        matchedCoords.add(`${r},${c + 1}`);
                        matchedCoords.add(`${r},${c + 2}`);
                    }
                }
            }

            // Vertikale Treffer prüfen / Check vertical matches
            for (let r = 0; r < GRID_SIZE - 2; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const stone = board[r][c];
                    if (stone && stone === board[r + 1][c] && stone === board[r + 2][c]) {
                        matchedCoords.add(`${r},${c}`);
                        matchedCoords.add(`${r + 1},${c}`);
                        matchedCoords.add(`${r + 2},${c}`);
                    }
                }
            }

            return Array.from(matchedCoords).map(coord => {
                const [r, c] = coord.split(',').map(Number);
                return { r, c };
            });
        }

        async function handleMatches() {
            let matches = checkMatches();

            while (matches.length > 0) {
                score += matches.length * 10;
                scoreElement.textContent = score;

                matches.forEach(({ r, c }) => {
                    board[r][c] = null;
                });

                updateRender();
                await new Promise(res => setTimeout(res, 200));

                applyGravity();
                fillNewStones();
                updateRender();
                await new Promise(res => setTimeout(res, 200));

                matches = checkMatches();
            }

            isProcessing = false;
        }

        function applyGravity() {
            for (let c = 0; c < GRID_SIZE; c++) {
                let emptyRow = GRID_SIZE - 1;
                // Von unten nach oben leere Felder auffüllen / Shift tiles down from bottom to top
                for (let r = GRID_SIZE - 1; r >= 0; r--) {
                    if (board[r][c] !== null) {
                        board[emptyRow][c] = board[r][c];
                        if (emptyRow !== r) {
                            board[r][c] = null;
                        }
                        emptyRow--;
                    }
                }
            }
        }

        function fillNewStones() {
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (board[r][c] === null) {
                        board[r][c] = getRandomStone();
                    }
                }
            }
        }

        createBoard();
    </script>
</body>
</html>
