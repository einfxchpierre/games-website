<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weltkarte Länder-Quiz</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/svg-pan-zoom/3.6.1/svg-pan-zoom.min.js"></script>
</head>
<body>

<div id="game-container">
    <div id="top-bar">
        <div class="info-box">Gesucht wird: <span id="target-country">-</span></div>
        <div class="info-box">Punkte: <span id="score">0</span></div>
    </div>
    
    <div id="feedback">Klicke auf 'Nächste Runde', um zu starten!</div>

    <div id="map-container">
        <svg id="world-map" viewBox="0 0 1008 651" xmlns="http://www.w3.org/2000/svg">
            <g id="countries-group">
                </g>
        </svg>
        
        <div id="zoom-controls">
            <button id="zoom-in">+</button>
            <button id="zoom-out">-</button>
            <button id="zoom-reset">⟲</button>
        </div>
    </div>

    <button id="next-btn">Nächste Runde</button>
</div>

<script src="script.js"></script>
</body>
</html>
