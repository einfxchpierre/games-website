<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <script src="/assets/js/boot.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Draw a Circle · GAMEHUB</title>
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/css/game.css">
    <style>
        :root {
            --color-red: #ff5470;
            --color-yellow: #ffc857;
            --color-green: #3ddc97;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow: hidden; touch-action: none; }

        header {
            width: 100%;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .highscore-box {
            display: flex; align-items: center; gap: 8px;
            height: 32px; padding: 0 14px;
            border: 1px solid var(--gh-line-strong); border-radius: 999px;
            color: var(--gh-text-2); font-size: 13px; font-weight: 500;
        }
        .highscore-box b { color: var(--gh-text); font-variant-numeric: tabular-nums; }

        .game-container {
            flex: 1;
            width: 100%;
            max-width: min(620px, 72vh);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            padding: 0 20px 30px;
        }
        .title { text-align: center; }
        .title h1 { font-size: 40px; letter-spacing: -0.045em; }
        .info-text { margin-top: 6px; text-align: center; color: var(--gh-text-2); font-size: 15px; }

        #canvas-container {
            width: 100%;
            aspect-ratio: 1;
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid var(--gh-line-strong);
            background:
                radial-gradient(circle at 50% 50%, rgba(226,84,214,0.10), transparent 60%),
                linear-gradient(180deg, var(--gh-card), var(--gh-card-2));
            box-shadow: 0 40px 100px -40px var(--gh-accent-glow);
            cursor: crosshair;
        }
        canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

        .result-overlay {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center; pointer-events: none; display: none;
            animation: scaleUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes scaleUp {
            from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .score-percentage { font-size: 72px; font-weight: 800; letter-spacing: -0.05em; line-height: 1; text-shadow: 0 0 40px currentColor; }
        .score-label { margin-top: 8px; color: var(--gh-text-2); font-size: 13px; font-weight: 500; }

        .btn { height: 46px; padding: 0 30px; font-size: 15px; }
        .challenges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
        .ch { min-width: 40px; height: 32px; padding: 0 12px; border: 1px solid var(--gh-line-strong); border-radius: 999px; background: transparent; color: var(--gh-text-2); font: 600 13px var(--gh-font); cursor: pointer; }
        .ch.on { background: #fff; border-color: #fff; color: #120816; }
        .ch.done:not(.on) { color: var(--color-green); border-color: rgba(61,220,151,.4); }
        .ch.locked { opacity: .35; cursor: not-allowed; }
        @media (max-width: 820px) { .title h1 { font-size: 28px; } .game-container { gap: 14px; justify-content: flex-start; } }
        .color-red { color: var(--color-red); }
        .color-yellow { color: var(--color-yellow); }
        .color-green { color: var(--color-green); }
    </style>
</head>
<body>

    <header>
        <a href="/" class="gh-back back-link">← Bibliothek</a>
        <div class="highscore-box">Bestwert <b><span id="highscore-val">0.0</span> %</b></div>
    </header>

    <div class="game-container">
        <div class="title"><span class="gh-label">Draw a Circle</span><h1>Perfekter Kreis</h1><div id="info-text" class="info-text">Zeichne einen Kreis in die Box!</div></div>

        <div class="challenges" id="challenges"></div>
        <div id="canvas-container">
            <canvas id="gameCanvas"></canvas>
            <div id="result-overlay" class="result-overlay">
                <div id="score-num" class="score-percentage">0%</div>
                <div class="score-label">Genauigkeit</div>
            </div>
        </div>

        <button id="reset-btn" class="btn gh-btn gh-btn-white" style="visibility: hidden;">Nochmal versuchen</button>
    </div>

    <script src="/games/drawacircle/challenges.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const infoText = document.getElementById('info-text');
        const resultOverlay = document.getElementById('result-overlay');
        const scoreNum = document.getElementById('score-num');
        const resetBtn = document.getElementById('reset-btn');
        const highscoreVal = document.getElementById('highscore-val');

        let points = [], drawStart = 0, evaluatedOnce = false;
        let isDrawing = false;
        let isFinished = false;

        // Highscore laden
        let highscore = localStorage.getItem('circle_highscore') || 0;
        highscoreVal.textContent = parseFloat(highscore).toFixed(1);

        // Canvas an Displaygröße & Retina-Auflösung anpassen
        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            
            // Wenn schon gezeichnet wurde, nach Resize neu rendern (optional)
            if (isFinished) {
                evaluateAndDraw();
            } else {
                clearCanvas();
            }
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        window.addEventListener('resize', resizeCanvas);
        // Kurzer Timeout damit die bounding boxes beim Laden stimmen
        setTimeout(resizeCanvas, 100);

        // Touch & Maus Events abfangen
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDrawing(e) {
            if (isFinished) return;
            isDrawing = true;
            points = [];
            drawStart = performance.now();
            const pos = getPos(e);
            points.push(pos);
            
            clearCanvas();
            ctx.beginPath();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.moveTo(pos.x, pos.y);
            
            infoText.textContent = "Schließe den Kreis...";
        }

        function draw(e) {
            if (!isDrawing || isFinished) return;
            const pos = getPos(e);
            points.push(pos);

            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function endDrawing() {
            if (!isDrawing || isFinished) return;
            isDrawing = false;

            // Zu wenige Punkte gezeichnet?
            if (points.length < 15) {
                infoText.textContent = "Das war zu kurz. Versuche es nochmal!";
                clearCanvas();
                return;
            }

            isFinished = true;
            evaluateAndDraw();
        }

        // Event Listener registrieren
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', endDrawing);

        /* ---------- Herausforderungen & Statistik ---------- */
        let challenge = -1; // -1 = freies Zeichnen
        const chBox = document.getElementById('challenges');
        function renderChallenges() {
            const unlocked = window.GHStats ? GHStats.unlocked('drawacircle') : 1;
            chBox.innerHTML = '<button class="ch' + (challenge < 0 ? ' on' : '') + '" data-ch="-1">Frei</button>' +
                CIRCLE_CHALLENGES.map((c, i) => '<button class="ch' + (challenge === i ? ' on' : '') + (i + 1 > unlocked ? ' locked' : '') + (i + 1 < unlocked ? ' done' : '') + '" data-ch="' + i + '"' + (i + 1 > unlocked ? ' disabled' : '') + ' title="' + c.desc + '">' + (i + 1 < unlocked ? '✓ ' : '') + (i + 1) + '</button>').join('');
            infoText.textContent = challenge < 0 ? 'Zeichne einen Kreis in die Box!' : 'Herausforderung ' + (challenge + 1) + ' · ' + CIRCLE_CHALLENGES[challenge].name + ': ' + CIRCLE_CHALLENGES[challenge].desc;
        }
        chBox.addEventListener('click', (e) => {
            const b = e.target.closest('[data-ch]'); if (!b || b.disabled) return;
            challenge = +b.dataset.ch;
            resetBtn.click();
            renderChallenges();
        });
        function onResult(res) {
            if (window.GHStats) GHStats.record('drawacircle', res.score);
            if (challenge < 0) return;
            const c = CIRCLE_CHALLENGES[challenge], r = checkCircleChallenge(c, res);
            if (r.ok) {
                if (window.GHStats) GHStats.unlock('drawacircle', challenge + 2);
                infoText.textContent = challenge + 1 < CIRCLE_CHALLENGES.length ? '✓ Geschafft! Herausforderung ' + (challenge + 2) + ' ist freigeschaltet.' : '✓ Alle Herausforderungen gemeistert!';
                const keep = challenge;
                renderChallenges();
                challenge = keep;
                infoText.textContent = keep + 1 < CIRCLE_CHALLENGES.length ? '✓ Geschafft! Herausforderung ' + (keep + 2) + ' ist freigeschaltet.' : '✓ Alle Herausforderungen gemeistert!';
            } else infoText.textContent = '✗ Nicht geschafft: ' + r.why;
        }
        renderChallenges();

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });
        window.addEventListener('touchend', endDrawing);

        // Logik zur Auswertung des Kreises
        function evaluateAndDraw() {
            // 1. Schwerpunkt (Mittelpunkt) berechnen
            let sumX = 0, sumY = 0;
            points.forEach(p => { sumX += p.x; sumY += p.y; });
            const centerX = sumX / points.length;
            const centerY = sumY / points.length;

            // 2. Durchschnittlichen Radius berechnen
            let sumRadius = 0;
            points.forEach(p => {
                const dx = p.x - centerX;
                const dy = p.y - centerY;
                sumRadius += Math.sqrt(dx * dx + dy * dy);
            });
            const avgRadius = sumRadius / points.length;

            // Sicherheitscheck gegen winzige Klicks
            if(avgRadius < 10) {
                isFinished = false;
                infoText.textContent = "Kreis ist zu klein!";
                clearCanvas();
                return;
            }

            // 3. Fehler pro Punkt ermitteln und Gesamt-Genauigkeit bestimmen
            let totalDeviation = 0;
            const pointEvaluations = points.map(p => {
                const dx = p.x - centerX;
                const dy = p.y - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const diff = Math.abs(dist - avgRadius);
                
                // Relative Abweichung zum Soll-Radius
                const relativeDiff = diff / avgRadius;
                totalDeviation += relativeDiff;

                return {
                    x: p.x,
                    y: p.y,
                    diffRatio: relativeDiff // 0 = perfekt, höher = schlechter
                };
            });

            // Durchschnittliche Genauigkeit kalkulieren
            const avgDeviation = totalDeviation / points.length;
            // Magische Formel für die Prozentwertung (100% ist unmöglich, verzeiht kleine Ruckler)
            let score = (1 - (avgDeviation * 2.2)) * 100;
            if (score < 0) score = 0;
            
            // Check ob der Kreis geschlossen wurde (Anfang zu Ende)
            const startP = points[0];
            const endP = points[points.length - 1];
            const gap = Math.sqrt(Math.pow(startP.x - endP.x, 2) + Math.pow(startP.y - endP.y, 2));
            const gapPenalty = (gap / avgRadius) * 20; // Abzug wenn nicht geschlossen
            score -= gapPenalty;
            if (score < 0) score = 0;

            // Canvas leeren, um den Auswertungs-Look zu malen
            const w = canvas.getBoundingClientRect().width;
            const h = canvas.getBoundingClientRect().height;
            ctx.clearRect(0, 0, w, h);

            // A. Optimalen Kreis zeichnen (Dezent Grau/Blau)
            ctx.beginPath();
            ctx.arc(centerX, centerY, avgRadius, 0, 2 * Math.PI);
            ctx.strokeStyle = 'rgba(226, 84, 214, 0.35)';
            ctx.lineWidth = 3;
            ctx.setLineDash([6, 6]); // Gestrichelt
            ctx.stroke();
            ctx.setLineDash([]); // Reset Dash

            // B. Gezeichneten Kreis farbkodiert nachziehen
            for (let i = 1; i < pointEvaluations.length; i++) {
                const p1 = pointEvaluations[i - 1];
                const p2 = pointEvaluations[i];

                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';

                // Toleranzwerte für Farbbereiche der Abschnitte
                // diffRatio = Abweichung vom perfekten Radius
                if (p2.diffRatio < 0.06) {
                    ctx.strokeStyle = '#3ddc97'; // Grün (Nahezu perfekt)
                } else if (p2.diffRatio < 0.15) {
                    ctx.strokeStyle = '#ffc857'; // Gelb (Mittelmäßig)
                } else {
                    ctx.strokeStyle = '#ff5470'; // Rot (Starke Abweichung)
                }
                ctx.stroke();
            }

            // 4. Score-Farbe ermitteln (0-50 Rot, 50-70 Gelb, 70-100 Grün)
            scoreNum.classList.remove('color-red', 'color-yellow', 'color-green');
            if (score <= 50) {
                scoreNum.classList.add('color-red');
            } else if (score <= 70) {
                scoreNum.classList.add('color-yellow');
            } else {
                scoreNum.classList.add('color-green');
            }

            // Score anzeigen
            scoreNum.textContent = score.toFixed(1) + '%';
            resultOverlay.style.display = 'block';
            infoText.textContent = "Auswertung fertig!";

            // Ergebnis an Statistik/Herausforderungen melden (nur einmal pro Zeichnung)
            if (!evaluatedOnce) {
                evaluatedOnce = true;
                onResult({ score: Math.round(score * 10) / 10, r: avgRadius / (w / 2), time: points.length ? performance.now() - drawStart : 0 });
            }

            // Highscore abgleichen & abspeichern
            if (score > highscore) {
                highscore = score;
                localStorage.setItem('circle_highscore', highscore);
                highscoreVal.textContent = score.toFixed(1);
            }

            // Reset Button sichtbar machen
            resetBtn.style.visibility = 'visible';
        }

        // Reset Button Klick
        resetBtn.addEventListener('click', () => {
            evaluatedOnce = false;
            isFinished = false;
            isDrawing = false;
            points = [];
            clearCanvas();
            resultOverlay.style.display = 'none';
            resetBtn.style.visibility = 'hidden';
            infoText.textContent = "Zeichne einen Kreis in die Box!";
        });
    </script>
</body>
</html>
