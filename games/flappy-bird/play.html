<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <script src="/assets/js/boot.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird · GAMEHUB</title>
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/css/game.css">
    <link rel="stylesheet" href="/games/flappy-bird/style.css">
</head>
<body>

    <div class="game-container">
        <aside class="side">
            <a href="/" class="gh-back back-link">← Bibliothek</a>
            <div>
                <span class="gh-label">Punkte</span>
                <div id="currentScore" class="score">0</div>
            </div>
            <div>
                <span class="gh-label">Bestwert</span>
                <div id="bestScore" class="gh-value">0</div>
            </div>
            <div>
                <span class="gh-label">Modus</span>
                <div class="gh-value" id="modeLabel" style="font-size:18px">Normal</div>
            </div>
            <p class="hint kbd-only"><kbd>Leertaste</kbd> oder Klick zum Fliegen</p>
            <p class="hint touch-only">Tippe aufs Spielfeld zum Fliegen</p>
        </aside>

        <div class="canvas-wrapper">
            <canvas id="birdCanvas"></canvas>

            <div id="restartMenu" class="gh-overlay">
                <div class="gh-overlay-card">
                    <h2 id="menuTitle">Flappy Bird</h2>
                    <p id="finalScore">Wähle eine Schwierigkeit.</p>
                    <div class="modes" id="modes">
                        <button class="gh-btn" data-mode="easy">Leicht</button>
                        <button class="gh-btn" data-mode="normal">Normal</button>
                        <button class="gh-btn" data-mode="hard">Schwer</button>
                    </div>
                    <button id="btnRestart" class="gh-btn gh-btn-white">Spiel starten</button>
                </div>
            </div>
        </div>

        <div class="controls"></div>
    </div>

    <script src="/games/flappy-bird/game.js"></script>
</body>
</html>
